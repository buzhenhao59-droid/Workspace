    请从知识图谱中查找相关政策节点：政策名称和版本；适用地区；具体条款。
    参考格式：政策：{name}（版本：{version}）| 适用地区：{region} | 条款：{clauses}

  complaint: |
    客户投诉：{complaint_query}
    请从知识图谱中查找：该投诉类型的标准处理流程；历史处理案例；关联政策和规定。
    参考格式：处理流程：{process} | 相关政策：{related_policies} | 历史案例：{cases}

