# ============ 8类意图分类 + 知识路由配置 ============
# 融合 cross-border-ecommerce-chatbot.md 意图分类系统
# 路由知识库: product_inquiry→商品库, logistics→物流库, payment→支付库,
#            refund_return→退换货政策, policy→政策库, account→账户帮助,
#            complaint→投诉流程, general→全量检索
intents:
  product_inquiry:
    description: "商品咨询 - 尺寸/颜色/材质/发货/库存"
    routed_kb: "商品知识库"
    response_style:
      zh: "规格列表 + 操作指引，专业、详细、数据化"
      en: "Spec list + guidance, professional and data-driven"
    escalation_threshold: 0.3  # 置信度低于此值时考虑升级
    escalation_keywords: ["违禁", "海关", "不能寄"]

  logistics:
    description: "物流咨询 - 物流到哪/几天到/快递状态"
    routed_kb: "物流知识库"
    response_style:
      zh: "实时状态 + 时间节点，清晰、准确、时间敏感"
      en: "Real-time status + timeline, clear and time-sensitive"
    escalation_threshold: 0.3
    escalation_keywords: ["违禁", "清关", "扣货"]

  payment:
    description: "支付咨询 - 支付/退款/到账/汇率/优惠"
    routed_kb: "支付库"
    response_style:
      zh: "操作步骤 + 金额说明，清晰、简洁、金额精确"
      en: "Steps + amount details, clear and precise"
    escalation_threshold: 0.3
    escalation_keywords: ["不到账", "被骗", "欺诈"]

  refund_return:
    description: "退换货 - 退货/换货/拒收/七天无理由"
    routed_kb: "退换货政策库"
    response_style:
      zh: "流程步骤 + 时间节点，耐心、流程化、温暖引导"
      en: "Step-by-step process + timeline, patient and warm"
    escalation_threshold: 0.4
    escalation_keywords: ["不接受", "不同意", "投诉", "曝光"]

  policy:
    description: "政策咨询 - 违禁品/海关/进口限制/平台规定"
    routed_kb: "政策库"
    response_style:
      zh: "规定引用 + 具体条款，权威、不可捏造"
      en: "Policy citation + clause, authoritative, no fabrication"
    escalation_threshold: 0.5
    escalation_keywords: ["不确定", "能寄吗", "可以运吗"]

  account:
    description: "账户咨询 - 账户/登录/封号/密码/认证"
    routed_kb: "账户帮助"
    response_style:
      zh: "解决步骤 + 操作指引，耐心、分步、安全提醒"
      en: "Fix steps + guidance, patient and security-aware"
    escalation_threshold: 0.4
    escalation_keywords: ["封号", "被盗", "资金安全"]

  complaint:
    description: "投诉处理 - 投诉/差评/态度/欺骗/虚假宣传"
    routed_kb: "投诉流程库"
    response_style:
      zh: "同理倾听 + 道歉 + 解决方案，优先级最高"
      en: "Empathy + apology + solution, highest priority"
    escalation_threshold: 0.0  # 投诉类直接升级
    escalation_keywords: []  # 全部升级人工

  general:
    description: "通用咨询 - 其他模糊问题/打招呼"
    routed_kb: "全量检索"
    response_style:
      zh: "友好引导 + 推荐操作，主动、友好、引导性"
      en: "Friendly guidance + recommendations, proactive"
    escalation_threshold: 0.3
    escalation_keywords: []

# ============ 升级规则配置 ============
# 融合源文件工单升级规则
escalation_rules:
  - trigger: "human_request"
    condition: "user mentions: 转人工/人工客服/真人/live agent/human"
    ticket_type: "人工介入"
    priority: "high"

  - trigger: "complaint_intent"
    condition: "intent == complaint"
    ticket_type: "投诉处理"
    priority: "high"

  - trigger: "fund_loss_risk"
    condition: "user mentions: 封号/资金损失/账号被盗/account hacked/money stolen"
    ticket_type: "资金安全"
    priority: "critical"

  - trigger: "low_confidence_policy"
    condition: "intent == policy AND confidence < 0.5"
    ticket_type: "政策咨询"
    priority: "medium"

  - trigger: "unresolved_3turns"
    condition: "turn_count >= 3 AND resolved == false"
    ticket_type: "升级咨询"
    priority: "medium"

  - trigger: "emotion_angry_high"
    condition: "emotion == angry AND intensity > 0.8"
    ticket_type: "紧急投诉"
    priority: "high"

# ============ RAG 检索配置 ============
# 融合源文件6层检索流水线
rag_config:
  enabled: true
  hybrid_search:
    enabled: true
    # 三路并行召回
    routes:
      - name: "商品知识库"
        vector_index: "product_chunks"
        weight: 0.4
        filter_fields: ["category", "brand", "locale"]
      - name: "平台政策库"
        vector_index: "policy_documents"
        weight: 0.3
        filter_fields: ["region", "version", "locale"]
      - name: "FAQ知识库"
        vector_index: "kb_articles"
        weight: 0.3
        filter_fields: ["intent", "locale"]
    # RRF 融合参数
    rrf_k: 60
  # HyDE 查询增强
  hyde:
    enabled: true
    instruction: "你是一个专业的跨境电商客服问答助手。请根据买家的问题，生成一个假设的最佳回答。要求：回答要专业、准确、简洁；包含具体的数据、步骤或事实。只输出假设回答内容，禁止任何解释或前缀。"
  # BGE-Reranker 精排
  reranker:
    enabled: true
    model: "BAAI/bge-reranker-v2-m3"
    top_k: 5
  # 知识图谱注入
  knowledge_graph:
    enabled: true
    neo4j_uri: "bolt://localhost:7687"
    relations:
      - "BELONGS_TO"     # 商品-类目
      - "BRAND"          # 品牌关系
      - "HAS_POLICY"     # 类目-政策
      - "RELATED_FAQ"    # FAQ关联

# ============ 知识图谱查询模板 ============
# 融合源文件图谱应用示例
graph_query_templates:
  product_inquiry: |
    已知客户想了解商品信息，商品为 {product_name}。
    请从知识图谱中查找：该商品所属品牌及品牌政策；所属类目及类目相关政策；常见问题FAQ链接。
    参考格式：品牌：{brand} | 类目：{category} | 进口限制：{restrictions} | 常见FAQ：{faq}

  logistics: |
    客户询问物流信息：{logistics_query}
    请从知识图谱中查找：该物流渠道的时效信息；目的地国家的清关要求；是否有延迟或异常记录。
    参考格式：预计时效：{days}天 | 清关要求：{customs} | 近期状态：{status}

  policy: |
