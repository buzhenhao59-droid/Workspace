# Redis 生产配置
bind 0.0.0.0
protected-mode yes
port 6379

# 持久化
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# 内存
maxmemory 512mb
maxmemory-policy allkeys-lru

# AOF
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 连接
timeout 300
tcp-keepalive 60
maxclients 10000

# Lua 脚本
lua-time-limit 5000
