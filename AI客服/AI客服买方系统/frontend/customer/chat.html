<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>专属客服</title>
  <style>
    /* ─── 设计令牌（与 index.html 完全一致）─── */
    :root {
      --bg:           #FFFFFF;
      --bg-subtle:    #F9F9F8;
      --bg-hover:     #F4F4F2;
      --surface:      #FFFFFF;
      --text-1:       #34322D;
      --text-2:       #6B6860;
      --text-3:       #9B9890;
      --text-4:       #C4C1B8;
      --border:       #E5E7EB;
      --border-soft:  rgba(0,0,0,0.06);
      --btn-primary-bg:   #1A1A19;
      --btn-primary-text: #FFFFFF;
      --btn-ghost-bg:     transparent;
      --btn-ghost-text:   #34322D;
      --btn-ghost-border: rgba(0,0,0,0.10);
      --bubble-ai:    #F4F4F2;
      --bubble-me:    #1A1A19;
      --bubble-me-text: #FFFFFF;
      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   22px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.07);
    }
    [data-theme="dark"] {
      --bg:           #1A1A18;
      --bg-subtle:    #222220;
      --bg-hover:     #2A2A28;
      --surface:      #242422;
      --text-1:       #F0EFE8;
      --text-2:       #A8A59C;
      --text-3:       #706D64;
      --text-4:       #504D46;
      --border:       rgba(255,255,255,0.08);
      --border-soft:  rgba(255,255,255,0.05);
      --btn-primary-bg:   #F0EFE8;
      --btn-primary-text: #1A1A18;
      --btn-ghost-bg:     transparent;
      --btn-ghost-text:   #A8A59C;
      --btn-ghost-border: rgba(255,255,255,0.10);
      --bubble-ai:    #2A2A28;
      --bubble-me:    #F0EFE8;
      --bubble-me-text: #1A1A18;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                   "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
      font-size: 15px; line-height: 1.6;
      background: var(--bg); color: var(--text-1);
      display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background .3s, color .3s;
    }

    /* ─── 顶部导航（与主页完全一致）─── */
    .nav {
      flex-shrink: 0;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: relative; z-index: 200;
      transition: background .3s, border-color .3s;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 500; color: var(--text-1);
      text-decoration: none;
    }
    .nav-logo-mark {
      width: 28px; height: 28px;
      background: var(--btn-primary-bg);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      transition: background .3s;
    }
    .nav-logo-mark svg { width: 16px; height: 16px; }
    .nav-center {
      position: absolute; left: 50%; transform: translateX(-50%);
      text-align: center; pointer-events: none;
    }
    .nav-title { font-size: 15px; font-weight: 500; color: var(--text-1); }
    .nav-sub   { font-size: 11px; color: var(--text-3); }
    .nav-right { display: flex; align-items: center; gap: 8px; position: relative; z-index: 201; }
    .btn-ghost {
      height: 34px; padding: 0 14px;
      background: var(--btn-ghost-bg);
      border: 1px solid var(--btn-ghost-border);
      border-radius: var(--radius-sm);
      color: var(--btn-ghost-text);
      font-size: 13px; font-family: inherit;
      cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center;
      transition: background .15s;
    }
    .btn-ghost:hover { background: var(--bg-hover); }

    /* ─── 错误条 ─── */
    .error-bar {
      display: none; flex-shrink: 0;
      padding: 9px 16px;
      background: #FEF2F2; border-bottom: 1px solid #FECACA;
      color: #B91C1C; font-size: 13px; text-align: center;
      position: relative; z-index: 100;
    }
    [data-theme="dark"] .error-bar {
      background: rgba(185,28,28,.12); border-color: rgba(185,28,28,.2); color: #FCA5A5;
    }

    /* ─── 登录区 ─── */
    .login-pane {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px;
      background: var(--bg);
      position: relative; z-index: 10;
    }
    .login-icon {
      width: 56px; height: 56px;
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 20px;
    }
    .login-title { font-size: 22px; font-weight: 400; color: var(--text-1); margin-bottom: 6px; }
    .login-desc  { font-size: 14px; color: var(--text-3); margin-bottom: 36px; text-align: center; }

    .login-card {
      width: 100%; max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .login-card-inner { padding: 20px 20px 14px; }
    .field-label { font-size: 12px; color: var(--text-3); margin-bottom: 8px; display: block; }
    .field-input {
      width: 100%; height: 42px; padding: 0 16px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      color: var(--text-1);
      font-size: 14px; font-family: inherit; outline: none;
      transition: border-color .15s, background .2s;
    }
    .field-input::placeholder { color: var(--text-4); }
    .field-input:focus { border-color: var(--text-3); background: var(--surface); }
    .login-card-footer {
      padding: 0 20px 16px;
      display: flex; justify-content: flex-end;
    }
    .btn-primary-full {
      height: 38px; padding: 0 20px;
      background: var(--btn-primary-bg);
      border: none; border-radius: var(--radius-full);
      color: var(--btn-primary-text);
      font-size: 14px; font-weight: 500; font-family: inherit;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      transition: opacity .15s, background .3s, color .3s;
    }
    .btn-primary-full:hover { opacity: .85; }
    .btn-primary-full:disabled { opacity: .45; cursor: not-allowed; }

    /* ─── 客户信息条 ─── */
    .cust-bar {
      display: none; flex-shrink: 0;
      height: 40px; padding: 0 24px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      align-items: center; justify-content: space-between;
      position: relative; z-index: 10;
    }
    .cust-bar.show { display: flex; }
    .cust-left { display: flex; align-items: center; gap: 8px; }
    .cust-av {
      width: 24px; height: 24px; border-radius: 6px;
      background: var(--btn-primary-bg);
      display: flex; align-items: center; justify-content: center;
      color: var(--btn-primary-text); font-size: 11px; font-weight: 600;
      transition: background .3s, color .3s;
    }
    .cust-name { font-size: 13px; font-weight: 500; color: var(--text-1); }
    .cust-tag {
      height: 20px; padding: 0 8px;
      background: var(--bg-hover);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-full);
      font-size: 11px; color: var(--text-3);
      display: inline-flex; align-items: center;
    }
    .btn-logout {
      height: 26px; padding: 0 10px;
      background: transparent;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      color: var(--text-3); font-size: 12px; font-family: inherit;
      cursor: pointer; transition: color .15s, background .15s;
    }
    .btn-logout:hover { color: #EF4444; background: #FEF2F2; }
    [data-theme="dark"] .btn-logout:hover { background: rgba(239,68,68,.12); }

    /* ─── 聊天主体 ─── */
    .chat-body { display: none; flex: 1; flex-direction: column; min-height: 0; position: relative; z-index: 10; }
    .chat-body.show { display: flex; }

    .messages {
      flex: 1; overflow-y: auto;
      padding: 24px 24px;
      background: var(--bg);
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 20px; text-align: center;
    }
    .welcome-icon {
      width: 48px; height: 48px; border-radius: var(--radius-md);
      background: var(--bg-subtle); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; margin-bottom: 14px;
    }
    .welcome h3 { font-size: 16px; font-weight: 400; color: var(--text-2); }

    /* 消息 */
    .msg { margin-bottom: 20px; display: flex; flex-direction: column; animation: msg-in .18s ease-out; }
    @keyframes msg-in { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }
    .msg.user      { align-items: flex-end; }
    .msg.assistant { align-items: flex-start; }

    .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 72%; }
    .msg.user .msg-row { flex-direction: row-reverse; }

    .msg-av {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .msg-av.ai   { background: var(--bg-subtle); border: 1px solid var(--border); }
    .msg-av.user {
      background: var(--btn-primary-bg); color: var(--btn-primary-text);
      font-size: 11px; font-weight: 600;
      transition: background .3s, color .3s;
    }

    .msg-bubble {
      padding: 10px 14px;
      font-size: 14px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.assistant .msg-bubble {
      background: var(--bubble-ai); color: var(--text-1);
      border-radius: 2px 12px 12px 12px;
    }
    .msg.user .msg-bubble {
      background: var(--bubble-me); color: var(--bubble-me-text);
      border-radius: 12px 2px 12px 12px;
    }
    .msg-time { font-size: 11px; color: var(--text-4); margin-top: 4px; padding: 0 2px; }
    .msg-bubble .chat-img { max-width: 260px; max-height: 200px; border-radius: 8px; display: block; }
    .msg-bubble .chat-video { max-width: 260px; max-height: 200px; border-radius: 8px; display: block; }

    /* 打字指示器 */
    .typing-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 20px; }
    .typing-bubble {
      padding: 12px 16px;
      background: var(--bubble-ai);
      border-radius: 2px 12px 12px 12px;
      display: flex; gap: 4px; align-items: center;
    }
    .td { width: 5px; height: 5px; border-radius: 50%; background: var(--text-4); animation: tdot 1.2s ease-in-out infinite; }
    .td:nth-child(2){animation-delay:.2s} .td:nth-child(3){animation-delay:.4s}
    @keyframes tdot{0%,80%,100%{transform:scale(.7);opacity:.35}40%{transform:scale(1);opacity:1}}

    /* ─── 智能意图指示器（融合源文件8类意图分类）─── */
    .intent-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: var(--radius-full);
      font-size: 11px; font-weight: 500;
      margin-top: 4px;
    }
    .intent-badge.product_inquiry { background: #EEF2FF; color: #4F46E5; }
    .intent-badge.logistics       { background: #F0FDF4; color: #16A34A; }
    .intent-badge.payment        { background: #FFF7ED; color: #EA580C; }
    .intent-badge.refund_return  { background: #FFF1F2; color: #E11D48; }
    .intent-badge.policy         { background: #F0F9FF; color: #0284C7; }
    .intent-badge.account        { background: #FAFAFA; color: #71717A; }
    .intent-badge.complaint      { background: #FEF2F2; color: #DC2626; }
    .intent-badge.general        { background: #F5F5F4; color: #78716C; }
    [data-theme="dark"] .intent-badge { filter: brightness(1.2); }

    /* ─── 情绪指示器（融合源文件情绪分类）─── */
    .emotion-indicator {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10px; color: var(--text-4);
      margin-left: 6px; vertical-align: middle;
    }
    .emotion-indicator.angry  { color: #DC2626; }
    .emotion-indicator.sad    { color: #7C3AED; }
    .emotion-indicator.anxious{ color: #D97706; }
    .emotion-indicator.happy  { color: #16A34A; }
    .emotion-indicator.neutral{ color: var(--text-4); }

    /* ─── 消息元数据行（意图+情绪）─── */
    .msg-meta {
      display: flex; align-items: center; gap: 6px;
      margin-top: 4px; padding: 0 2px;
    }

    /* ─── 翻译面板样式扩展─── */
    .trans-wrap { margin-top: 5px; }
    .trans-toggle {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; color: var(--text-4);
      cursor: pointer; user-select: none;
      transition: color .15s;
    }
    .trans-toggle:hover { color: var(--text-2); }
    .trans-panel {
      display: none; margin-top: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .trans-panel.show { display: block; }
    .trans-row {
      display: flex; align-items: baseline; gap: 10px;
      padding: 8px 12px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    .trans-row:last-child { border-bottom: none; }
    .trans-row:hover { background: var(--bg-hover); }
    .t-lang { font-size: 11px; color: var(--text-3); min-width: 60px; flex-shrink: 0; }
    .t-text { font-size: 13px; color: var(--text-1); line-height: 1.5; }

    /* ─── 语言切换栏 + 转人工（同一行，右侧留出个人信息按钮空间，避免重叠）─── */
    .lang-bar {
      flex-shrink: 0;
      padding: 8px 24px;
      padding-right: 72px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      position: relative; z-index: 10;
    }
    .lang-bar-left { display: flex; align-items: center; min-width: 0; }
    .lang-bar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; max-width: calc(100% - 120px); }
    .lang-label { font-size: 12px; color: var(--text-3); flex-shrink: 0; }
    .lang-btn {
      height: 28px; padding: 0 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      color: var(--text-3); font-size: 12px; font-family: inherit;
      cursor: pointer; transition: background .15s, color .15s, border-color .15s;
    }
    .lang-btn:hover { background: var(--bg-hover); color: var(--text-1); }
    .lang-btn.active {
      background: var(--btn-primary-bg); color: var(--btn-primary-text);
      border-color: transparent;
      transition: background .3s, color .3s;
    }

    /* ─── 输入区（右侧留出个人信息按钮空间）─── */
    .input-area {
      flex-shrink: 0;
      padding: 12px 24px 16px;
      padding-right: 72px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      position: relative; z-index: 10;
    }
    .input-wrap {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 0 6px 0 18px;
      transition: border-color .15s;
    }
    .input-wrap:focus-within { border-color: var(--text-3); }
    .chat-input {
      flex: 1; height: 44px;
      background: transparent; border: none; outline: none;
      color: var(--text-1); font-size: 14px; font-family: inherit;
    }
    .chat-input::placeholder { color: var(--text-4); }
    .btn-send {
      width: 34px; height: 34px; flex-shrink: 0;
      background: var(--btn-primary-bg);
      border: none; border-radius: 50%;
      color: var(--btn-primary-text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: opacity .15s, background .3s, color .3s;
    }
    .btn-send:hover { opacity: .85; }
    .btn-send:disabled { opacity: .4; cursor: not-allowed; }
    .btn-send svg { width: 14px; height: 14px; }

    /* ─── 转人工按钮（与语言栏同一行，不遮挡）─── */
    .transfer-btn {
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      color: var(--text-2);
      font-size: 12px;
      cursor: pointer;
      transition: background .15s, color .15s;
      display: none;
    }
    .transfer-btn.show { display: inline-flex; align-items: center; }
    .transfer-btn:hover { background: var(--bg-hover); color: var(--text-1); }

    /* ─── 悬浮按钮 ─── */
    .fab {
      position: fixed; bottom: 80px; right: 20px;
      width: 44px; height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: none; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer;
      box-shadow: var(--shadow-md);
      z-index: 300;
      transition: background .15s, box-shadow .15s;
    }
    .fab.show { display: flex; }
    .fab:hover { background: var(--bg-hover); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }

    /* ─── 模态框 ─── */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.3); backdrop-filter: blur(4px);
      align-items: center; justify-content: center;
      z-index: 500; padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%; max-width: 440px;
      max-height: 80vh; overflow-y: auto;
      box-shadow: var(--shadow-md);
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
      background: var(--surface);
    }
    .modal-head h2 { font-size: 15px; font-weight: 500; color: var(--text-1); }
    .modal-close {
      width: 28px; height: 28px;
      background: var(--bg-hover); border: none; border-radius: 6px;
      color: var(--text-3); font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .modal-close:hover { background: var(--border); }
    .info-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .info-section:last-child { border-bottom: none; }
    .info-section-title { font-size: 11px; color: var(--text-4); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
    .info-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; }
    .info-k { font-size: 13px; color: var(--text-3); }
    .info-v { font-size: 13px; color: var(--text-1); font-weight: 500; }
    .order-card {
      background: var(--bg-subtle); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 14px;
      margin-bottom: 8px; font-size: 13px; line-height: 1.7;
    }
    .order-card:last-child { margin-bottom: 0; }
    .loading-dots { display: flex; gap: 6px; justify-content: center; padding: 32px; }
    .loading-dots span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--text-4);
      animation: tdot 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2){animation-delay:.2s}
    .loading-dots span:nth-child(3){animation-delay:.4s}

    /* ─── 飘落动画（与主页一致）─── */
    #gift-anim { position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }
    .gift-item { position:absolute; top:-50px; font-size:18px; opacity:.35; animation:fall linear forwards; }
    @keyframes fall { 0%{transform:translateY(-50px) rotate(0deg);opacity:0} 8%{opacity:.35} 92%{opacity:.1} 100%{transform:translateY(100vh) rotate(300deg);opacity:0} }

    /* 花瓣 */
    .petal-item {
      position: absolute; top: -20px;
      width: 10px; height: 14px;
      border-radius: 50% 0 50% 0;
      pointer-events: none;
      animation: petal-fall linear forwards;
    }
    @keyframes petal-fall {
      0%   { transform: translateY(-20px) rotate(0deg) scale(1);   opacity: 0; }
      6%   { opacity: .30; }
      90%  { opacity: .10; }
      100% { transform: translateY(100vh) rotate(540deg) scale(.7); opacity: 0; }
    }

    /* 星星 Canvas */
    #star-canvas {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: none;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <script>
  /* ── 飘落礼物（与主页完全一致）── */
  (function(){

  /* ── 梅花花瓣雨（浅色模式，5秒后消失）── */
  (function(){
    var petalColors = ['#FF3D7F','#FF1A6C','#FF6699','#FF4488','#FF85A1','#FFB3C6','#E8174D'];
    var container = document.body;
    var petals = [];
    var petalTimer = null;

    function createPetal(){
      var el = document.createElement('div');
      el.className = 'petal-item';
      var color = petalColors[Math.floor(Math.random()*petalColors.length)];
      el.style.cssText = [
        'left:'+Math.random()*100+'%',
        'background:'+color,
        'opacity:0.30',
        'animation-duration:'+(4+Math.random()*4)+'s',
        'animation-delay:'+Math.random()*1.2+'s',
        'transform:rotate('+Math.random()*360+'deg)',
        'width:'+(8+Math.random()*6)+'px',
        'height:'+(10+Math.random()*8)+'px'
      ].join(';');
      container.appendChild(el);
      setTimeout(function(){ el.remove(); }, 8000);
    }

    function startPetals(){
      var count = 0;
      var maxCount = 15;
      petalTimer = setInterval(function(){
        if(count >= maxCount){ clearInterval(petalTimer); return; }
        createPetal();
        count++;
      }, 240);
      setTimeout(function(){ clearInterval(petalTimer); }, 5000);
    }

    window._petalStart = startPetals;
  })();

  /* ── 星星 Canvas（深色模式，从少到多5秒，持续闪烁）── */
  (function(){
    var canvas = document.getElementById('star-canvas');
    var ctx = canvas.getContext('2d');
    var W, H;
    var stars = [];
    var raf = null;
    var startTime = null;
    var GROW_DURATION = 5000;
    var running = false;

    function resize(){
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function initStars(){
      resize();
      stars = [];
      var total = 180;
      for(var i=0; i<total; i++){
        stars.push({
          x: Math.random()*W,
          y: Math.random()*H,
          r: Math.random()*1.4+0.2,
          brightness: Math.random(),
          twinkleSpeed: 0.2+Math.random()*1.0,
          twinklePhase: Math.random()*Math.PI*2,
          appearAt: Math.random()
        });
      }
    }

    function draw(ts){
      if(!startTime) startTime = ts;
      var elapsed = ts - startTime;
      var progress = Math.min(elapsed/GROW_DURATION, 1);

      ctx.clearRect(0,0,W,H);

      var now = ts/1000;
      stars.forEach(function(s){
        var reveal = Math.max(0, Math.min(1, (progress - s.appearAt)/0.3));
        if(reveal <= 0) return;
        var twinkle = 0.5+0.5*Math.sin(now*s.twinkleSpeed+s.twinklePhase);
        var alpha = reveal*(0.12+0.33*twinkle)*(0.5+s.brightness*0.5);

        // 边缘渐隐
        var edgeFade = Math.min(s.x/W, (W-s.x)/W, s.y/H, (H-s.y)/H);
        edgeFade = Math.min(1, edgeFade*8);
        alpha *= edgeFade;
        if(alpha <= 0.01) return;

        ctx.fillStyle = 'rgba(255,255,255,'+alpha+')';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      });

      if(running) raf = requestAnimationFrame(draw);
    }

    function startStars(){
      if(running) return;
      running = true; startTime = null;
      initStars();
      canvas.style.display = 'block';
      raf = requestAnimationFrame(draw);
    }
    function stopStars(){
      running = false;
      if(raf) cancelAnimationFrame(raf);
      ctx.clearRect(0,0,W||0,H||0);
      canvas.style.display = 'none';
    }

    window.addEventListener('resize', function(){ if(running) initStars(); });
    window._starsStart = startStars;
    window._starsStop  = stopStars;
  })();

  /* ── 主题切换（与主页完全一致）── */
  (function(){
    var btn = document.getElementById('themeBtn');

    function apply(t){
      if(t === 'dark'){
        document.documentElement.setAttribute('data-theme','dark');
        btn.textContent = '浅色';
        window._starsStart && window._starsStart();
      } else {
        document.documentElement.removeAttribute('data-theme');
        btn.textContent = '深色';
        window._starsStop && window._starsStop();
        window._petalStart && window._petalStart();
      }
    }

    var saved = localStorage.getItem('theme') || 'light';
    apply(saved);

    btn.addEventListener('click', function(){
      var cur = document.documentElement.getAttribute('data-theme');
      var next = cur === 'dark' ? 'light' : 'dark';
      apply(next);
      localStorage.setItem('theme', next);
    });
  })();

  /* ── 业务逻辑（完整保留）── */

  var humanInitStarted = false; // 防止 initHumanModeIfNeeded 与 pollMessages 竞争 fetch
  var shownMessageIds = {};     // 已展示消息ID集合，用于去重

  try{

    audio.volume = 0.3;
    audio.play().catch(function(){});
  } catch(e){}

  // 检查是否存在有效的 session_id（支持无缝跳转）
  (function(){
    // 优先检查 URL 参数（从主页搜索后跳转带 session_id）
    var urlParams = new URLSearchParams(window.location.search);
    var urlSessionId = urlParams.get('session_id');

    // 检查 localStorage 中的缓存 session
    var cachedSessionId = localStorage.getItem('cust_session_id');

    // 优先使用 URL 参数，其次使用缓存
    var validSessionId = urlSessionId || cachedSessionId;

    if(validSessionId){
      // 直接使用已有的 session_id，进入聊天界面（无图二）
      sessionId = validSessionId;

      // 获取客户信息并直接进入聊天界面
      var cachedInfo = localStorage.getItem('cust_customer_info');
      if(cachedInfo){
        try{
          var customerInfo = JSON.parse(cachedInfo);
          if(customerInfo && customerInfo.customer){
            var c = customerInfo.customer;
            var name = c.name || '尊贵的客户';
            document.getElementById('custName').textContent = name;
            var tag = document.getElementById('custTag');
            tag.textContent = c.level || c.m_value || 'VIP';
            tag.style.display = 'inline-flex';
            document.getElementById('custBar').classList.add('show');
            document.getElementById('custBar').style.display = 'flex';
            document.getElementById('chatBody').classList.add('show');
            document.getElementById('fabInfo').classList.add('show');
            window.history.replaceState({}, document.title, window.location.pathname);
            initHumanModeIfNeeded();
            return;
          }
        } catch(e){}
      }

      // 如果没有缓存信息，尝试获取客户信息
      fetch('/api/customer/myinfo', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: validSessionId})
      })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.success && data.data && data.data.customer){
          var c = data.data.customer;
          var name = c.name || '尊贵的客户';
          document.getElementById('custName').textContent = name;
          var tag = document.getElementById('custTag');
          tag.textContent = c.level || c.m_value || 'VIP';
          tag.style.display = 'inline-flex';
          document.getElementById('custBar').classList.add('show');
          document.getElementById('custBar').style.display = 'flex';
          document.getElementById('chatBody').classList.add('show');
          document.getElementById('fabInfo').classList.add('show');
          localStorage.setItem('cust_customer_info', JSON.stringify(data.data));
          window.history.replaceState({}, document.title, window.location.pathname);
          initHumanModeIfNeeded();
        } else {
          localStorage.removeItem('cust_session_id');
          localStorage.removeItem('cust_customer_info');
          window.location.href = '/';
        }
      })
      .catch(function(){
        localStorage.removeItem('cust_session_id');
        localStorage.removeItem('cust_customer_info');
        window.location.href = '/';
      });
    } else {
      // 无 session：从首页搜索进入，直接回首页
      window.location.href = '/';
    }
  })();

  document.getElementById('chatInput').addEventListener('keypress', function(e){ if(e.key==='Enter') sendMessage(); });

  function showError(msg){
    var el = document.getElementById('errorBar');
    el.textContent = msg; el.style.display = 'block';
    setTimeout(function(){ el.style.display='none'; }, 5000);
  }

  function esc(t){ var d=document.createElement('div'); d.textContent=String(t??''); return d.innerHTML; }
  function escAttr(t){ var d=document.createElement('div'); d.textContent=String(t??''); return d.innerHTML.replace(/"/g,'&quot;'); }

  function bubbleContentHtml(content){
    if(!content) return '';
    var s = String(content).trim();
    if(s.indexOf('{')===0){
      try{
        var o = JSON.parse(s);
        if(o && o.type === 'text'){
          var text = o.translated || o.original || o.zh || '';
          return esc(text);
        }
        if(o&&o.type==='image'&&o.url) return '<img class="chat-img" src="'+esc(o.url)+'" alt="图片">';
        if(o&&o.type==='video'&&o.url) return '<video class="chat-video" src="'+esc(o.url)+'" controls></video>';
      }catch(e){}
    }
    return esc(s);
  }

  // 意图名称映射（融合源文件8类意图分类）
  var INTENT_NAMES = {
    'product_inquiry': '商品咨询',
    'logistics': '物流咨询',
    'payment': '支付咨询',
    'refund_return': '退换货',
    'policy': '政策咨询',
    'account': '账户咨询',
    'complaint': '投诉处理',
    'general': '通用咨询'
  };
  // 情绪图标映射
  var EMOTION_ICONS = {
    'angry': '😠', 'sad': '😢', 'anxious': '😰',
    'happy': '😊', 'neutral': '🤖'
  };

  function addMsg(role, content, meta){
    meta = meta || {};
    var wrap = document.getElementById('msgList');
    var time = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    var initials = document.getElementById('custAv').textContent || 'U';
    var avHtml = role==='assistant'
      ? '<div class="msg-av ai">🤖</div>'
      : '<div class="msg-av user">'+esc(initials)+'</div>';
    var bubbleHtml = bubbleContentHtml(content);

    // 构建意图+情绪指示器（仅AI回复）
    var metaHtml = '';
    if(role==='assistant' && (meta.intent || meta.emotion)){
      var parts = [];
      if(meta.intent && INTENT_NAMES[meta.intent]){
        parts.push('<span class="intent-badge '+escAttr(meta.intent)+'">'+esc(INTENT_NAMES[meta.intent])+'</span>');
      }
      if(meta.emotion && EMOTION_ICONS[meta.emotion]){
        parts.push('<span class="emotion-indicator '+escAttr(meta.emotion)+'">'+EMOTION_ICONS[meta.emotion]+'</span>');
      }
      if(parts.length > 0){
        metaHtml = '<div class="msg-meta">'+parts.join('')+'</div>';
      }
    }

    var extra = '';
    if(role==='assistant' && content && typeof content==='string' && content.trim().indexOf('{')!==0){
      extra = '<div class="trans-wrap"><span class="trans-toggle" onclick="toggleTrans(this)" data-text="'+escAttr(content)+'">翻译 ▾</span>'
        +'<div class="trans-panel">'
        +'<div class="trans-row" data-target="zh"><span class="t-lang">中文</span><span class="t-text">点击加载</span></div>'
        +'<div class="trans-row" data-target="en"><span class="t-lang">English</span><span class="t-text">点击加载</span></div>'
        +'<div class="trans-row" data-target="ar"><span class="t-lang">العربية</span><span class="t-text">点击加载</span></div>'
        +'<div class="trans-row" data-target="ru"><span class="t-lang">Русский</span><span class="t-text">点击加载</span></div>'
        +'</div></div>';
    }
    var div = document.createElement('div');
    div.className = 'msg '+role;
    div.innerHTML = '<div class="msg-row">'+avHtml+'<div class="msg-bubble">'+bubbleHtml+'</div></div>'
      +'<div class="msg-time">'+time+'</div>'+metaHtml+extra;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function toggleTrans(el){
    var panel = el.nextElementSibling;
    var open = !panel.classList.contains('show');
    panel.classList.toggle('show', open);
    el.textContent = open ? '翻译 ▴' : '翻译 ▾';
    if(open) initTransPanel(panel, el.dataset.text || '');
  }
  function initTransPanel(panel, text){
    if(panel.dataset.inited) return;
    panel.dataset.inited = '1';
    panel.querySelectorAll('.trans-row').forEach(function(row){
      row.addEventListener('click', function(){
        var target = row.dataset.target;
        var el = row.querySelector('.t-text');
        if(!el || el.dataset.loaded===target) return;
        el.textContent = '加载中…';
        fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,target:target})})
          .then(function(r){ return r.json(); })
          .then(function(d){ el.textContent=(d&&d.success&&d.translated)?d.translated:(d&&d.message)||'翻译失败'; el.dataset.loaded=target; })
          .catch(function(){ el.textContent='网络错误'; });
      });
    });
  }

  // 判断是否包含「转人工」意图（客户打字转人工时自动转接）
  function wantsTransferHuman(text){
    if(!text || typeof text !== 'string') return false;
    var t = text.trim().toLowerCase();
    return t.indexOf('转人工') !== -1 || t === '人工' || t === '转人工客服' || t.indexOf('转接人工') !== -1;
  }

  async function sendMessage(){
    if(!sessionId) return;
    var input = document.getElementById('chatInput');
    var msg = input.value.trim();
    if(!msg) return;
    input.value = '';
    addMsg('user', msg);
    var btn = document.getElementById('sendBtn');
    btn.disabled = true;
    if(isHumanMode){
      // 买方系统：人工模式走 REST API（坐席消息通过共享数据库轮询）
      try{
        var res = await fetch('/api/customer/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,content:msg})});
        var data;
        try{ data = await res.json(); } catch(_){ data = { success: false, message: '发送失败，请重试' }; }
        if(!data.success) showError(data.message || '发送失败');
      } catch(e){ showError('发送失败，请检查网络后重试'); }
      btn.disabled = false;
      return;
    }
    // 客户手动输入「转人工」等：先执行转人工，再按人工模式发送并开始轮询
    if(wantsTransferHuman(msg)){
      try{
        var tr = await fetch('/api/customer/transfer-to-human?session_id=' + sessionId, { method: 'POST', headers: {'Content-Type':'application/json'} });
        var trData = await tr.json();
        await fetch('/api/customer/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,content:msg})});
        addMsg('assistant', '好的，已为您转接人工客服。请稍候，客服人员将很快为您服务。');
        document.getElementById('transferBtn').classList.remove('show');
        isHumanMode = true;
        var mr = await fetch('/api/customer/messages?session_id=' + sessionId);
        var mrData = await mr.json();
        if(mrData.success && mrData.data && mrData.data.messages) lastShownMessageCount = mrData.data.messages.length;
        startPolling();
      } catch(e){ showError('网络错误'); }
      btn.disabled = false;
      return;
    }
    var wrap = document.getElementById('msgList');
    var loading = document.createElement('div');
    loading.id = 'typing'; loading.className = 'typing-row';
    loading.innerHTML = '<div class="msg-av ai">🤖</div><div class="typing-bubble"><div class="td"></div><div class="td"></div><div class="td"></div></div>';
    wrap.appendChild(loading);
    wrap.scrollTop = wrap.scrollHeight;
    
    // 添加超时控制
    var timeoutId = setTimeout(function(){
      var t = document.getElementById('typing'); if(t) t.remove();
      addMsg('assistant','网络有点慢，请稍后重试');
      btn.disabled = false;
    }, 30000); // 30秒超时
    
    try{
      var res = await fetch('/api/customer/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,message:msg})});
      clearTimeout(timeoutId);
      var t = document.getElementById('typing'); if(t) t.remove();
      var data = await res.json();
      if(data.success){
        // 传递意图+情绪元数据（由后端 ai_enhanced_response.py 注入）
        addMsg('assistant', data.response, {
          intent: data.intent || null,
          emotion: data.emotion || null
        });
        checkShowTransferButton(msg, data.response);
      } else {
        showError(data.message || '回复失败，请稍后重试');
      }
    } catch(e){
      clearTimeout(timeoutId);
      var t = document.getElementById('typing'); if(t) t.remove();
      addMsg('assistant','网络错误，请稍后重试');
    } finally{ btn.disabled = false; }
  }

  // 转人工相关
  var msgCount = 0;
  var transferShown = false;

  // 需要转人工的关键词（融合源文件8类意图 + 升级规则）
  // 涵盖: 投诉/退款/退货/政策咨询(低置信度)/账户安全/人工请求
  var transferKeywords = [
    // 投诉/差评类
    '退换货','退货','换货','退款','售后','投诉','差评',
    // 优惠/价格争议类
    '价格','便宜','便宜点','能不能便宜','优惠','折扣',
    // 人工请求类
    '人工','真人','有人吗','客服',
    // 账户安全类
    '封号','被盗','账号异常','密码错误','无法登录',
    // 政策/违禁类
    '违禁','海关','限制','不能寄','可以寄吗',
    // 英文关键词
    'refund','return','exchange','complaint','live agent','human','account','prohibited'
  ];

  function checkShowTransferButton(userMsg, aiMsg){
    msgCount++;
    
    // 检查用户消息是否包含转人工关键词
    var userLower = userMsg.toLowerCase();
    var needTransfer = transferKeywords.some(function(k){
      return userLower.includes(k.toLowerCase());
    });

    // 或者 AI 回复中包含特定标记（如"抱歉，我无法处理"）
    var aiLower = aiMsg.toLowerCase();
    var aiCantHandle = aiLower.includes('抱歉') && (aiLower.includes('无法') || aiLower.includes('不能') || aiLower.includes('不了'));

    // 满足条件显示转人工按钮
    if(needTransfer || aiCantHandle || msgCount >= 3){
      document.getElementById('transferBtn').classList.add('show');
      transferShown = true;
    }
  }

  function transferToHuman(){
    if(!sessionId) return;

    fetch('/api/customer/transfer-to-human?session_id=' + sessionId, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'}
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      addMsg('assistant', '您已转接人工客服，请稍候，客服人员会尽快回复您。');
      document.getElementById('transferBtn').classList.remove('show');
      isHumanMode = true;
      fetch('/api/customer/messages?session_id=' + sessionId)
        .then(function(r){ return r.json(); })
        .then(function(res){
          if(res.success && res.data && res.data.messages){
            lastShownMessageCount = res.data.messages.length;
          }
          startPolling();
        })
        .catch(function(){ startPolling(); });
    })
    .catch(function(){
      addMsg('assistant', '已为您转接人工客服，请稍候...');
      document.getElementById('transferBtn').classList.remove('show');
      isHumanMode = true;
      startPolling();
    });
  }

  function startPolling(){
    if(pollTimer) return;
    pollMessages();
    pollTimer = setInterval(pollMessages, 500);
  }
  function stopPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }
  function pollMessages(){
    if(!sessionId) return;

    // 如果 initHumanModeIfNeeded 正在加载（页面刷新后），跳过本次轮询等待其完成
    if(humanInitStarted) return;

    // 每次轮询时检查会话状态，如果已转回AI则自动切换模式
    fetch('/api/customer/session?session_id=' + sessionId)
      .then(function(r){ return r.json(); })
      .then(function(sessionRes){
        // 如果会话已转回AI（is_ai = true），则切换到AI模式
        if(sessionRes.success && sessionRes.data && sessionRes.data.is_ai === true && isHumanMode){
          isHumanMode = false;
          stopPolling();
          document.getElementById('transferBtn').classList.add('show');
          addMsg('assistant', '已为您转回AI客服，请继续留言，AI会尽快回复您。');
        }
        // 更新语言按钮状态
        if(sessionRes.success && sessionRes.data && sessionRes.data.language){
          var currentLang = sessionRes.data.language;
          document.querySelectorAll('#langBar .lang-btn').forEach(function(b){
            b.classList.toggle('active', b.dataset.lang === currentLang);
          });
        }
      })
      .catch(function(){});

    // 轮询拉取人工消息：买方系统通过 REST API 轮询共享数据库
    fetch('/api/customer/messages?session_id=' + sessionId)
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(!res.success || !res.data || !res.data.messages) return;
        var list = res.data.messages;
        if(list.length === 0) return;
        var prevCount = lastShownMessageCount;
        // 刚转人工时 lastShownMessageCount 可能为 0（如点按钮转人工且消息已清空），此时客服发来的消息也要展示
        if(prevCount === 0 && list.length > 0){
          for(var i = 0; i < list.length; i++){
            var m = list[i];
            var role = (m && m.role) ? String(m.role) : '';
            if(role === 'seller' || role === 'assistant') addMsg('assistant', m.content || '');
          }
          lastShownMessageCount = list.length;
          var wrap = document.getElementById('msgList');
          if(wrap) wrap.scrollTop = wrap.scrollHeight;
          return;
        }
        lastShownMessageCount = list.length;
        for(var i = prevCount; i < list.length; i++){
          var m = list[i];
          var role = (m && m.role) ? String(m.role) : '';
          if(role === 'seller' || role === 'assistant') addMsg('assistant', m.content || '');
        }
        if(list.length > prevCount){
          var wrap = document.getElementById('msgList');
          if(wrap) wrap.scrollTop = wrap.scrollHeight;
        }
      })
      .catch(function(){});
  }

  // 页面加载时若已是人工会话，则恢复人工模式并轮询
  function initHumanModeIfNeeded(){
    if(!sessionId) return;
    humanInitStarted = true; // 阻止 pollMessages 在初始化期间干扰
    fetch('/api/customer/session?session_id=' + sessionId)
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(!res.success || !res.data){ humanInitStarted = false; return; }
        // 设置当前语言按钮
        var currentLang = res.data.language || 'zh';
        document.querySelectorAll('#langBar .lang-btn').forEach(function(b){
          b.classList.toggle('active', b.dataset.lang === currentLang);
        });
        if(res.data.is_ai === false){
          isHumanMode = true;
          document.getElementById('transferBtn').classList.remove('show');
          fetch('/api/customer/messages?session_id=' + sessionId)
            .then(function(r){ return r.json(); })
            .then(function(msgRes){
              if(!msgRes.success || !msgRes.data || !msgRes.data.messages){ humanInitStarted = false; return; }
              var list = msgRes.data.messages;
              var wrap = document.getElementById('msgList');
              wrap.innerHTML = '';
              lastShownMessageCount = 0;
              list.forEach(function(m){
                if(m.role === 'user') addMsg('user', m.content);
                else if(m.role === 'assistant' || m.role === 'seller') addMsg('assistant', m.content);
                lastShownMessageCount++;
              });
              humanInitStarted = false; // 初始化完成，允许 pollMessages 工作
              startPolling();
            })
            .catch(function(){ humanInitStarted = false; });
        } else {
          // AI 模式：从共享库恢复历史消息（刷新页面后仍能看到对话）
          fetch('/api/customer/messages?session_id=' + sessionId)
            .then(function(r){ return r.json(); })
            .then(function(msgRes){
              if(!msgRes.success || !msgRes.data || !msgRes.data.messages){
                humanInitStarted = false;
                return;
              }
              var list = msgRes.data.messages;
              if(list.length > 0){
                var wrap = document.getElementById('msgList');
                wrap.innerHTML = '';
                lastShownMessageCount = 0;
                list.forEach(function(m){
                  if(m.role === 'user') addMsg('user', m.content);
                  else if(m.role === 'assistant' || m.role === 'seller') addMsg('assistant', m.content);
                  lastShownMessageCount++;
                });
              }
              humanInitStarted = false;
            })
            .catch(function(){ humanInitStarted = false; });
        }
      })
      .catch(function(){ humanInitStarted = false; });
  }
  window.addEventListener('beforeunload', function(){ stopPolling(); });

  function logout(){
    if(sessionId) fetch('/api/customer/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId})});
    sessionId = null;
    localStorage.removeItem('cust_session_id');
    localStorage.removeItem('cust_customer_info');
    window.location.href = '/';
  }

  document.querySelectorAll('#langBar .lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var lang = this.dataset.lang;
      if(!sessionId){ showError('请先登录后再切换语言'); return; }
      // 转人工后切换语言：仅更新语言并提示成功，不断开与人工客服的连接
      fetch('/api/customer/change_language',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,language:lang})})
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(data.success){
            document.querySelectorAll('#langBar .lang-btn').forEach(function(b){ b.classList.remove('active'); });
            btn.classList.add('active');
            if(data.welcome_message) addMsg('assistant', data.welcome_message);
            // 人工模式下不改变 isHumanMode，轮询与发送仍走人工通道
          } else showError(data.message || '切换失败');
        }).catch(function(){ showError('语言切换失败，请重试'); });
    });
  });

  function openInfo(){
    if(!sessionId){ showError('请先登录'); return; }
    document.getElementById('infoModal').classList.add('active');
    loadInfo();
  }
  function closeModal(){ document.getElementById('infoModal').classList.remove('active'); }
  document.getElementById('infoModal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

  async function loadInfo(){
    var content = document.getElementById('infoContent');
    content.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
    try{
      var res = await fetch('/api/customer/myinfo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId})});
      var data = await res.json();
      if(data.success){
        var c = data.data.customer || {};
        var orders = data.data.orders || [];
        var html = '<div class="info-section"><div class="info-section-title">基本信息</div>';
        [['客户 ID',c.customer_id||c.id],['姓名',c.name],['手机',c.phone],['地区',c.region||c.area],['会员等级',c.level||c.m_value]].forEach(function(r){
          html += '<div class="info-row"><span class="info-k">'+esc(r[0])+'</span><span class="info-v">'+esc(r[1]||'-')+'</span></div>';
        });
        html += '</div><div class="info-section"><div class="info-section-title">我的订单（'+orders.length+'）</div>';
        if(orders.length > 0){
          orders.forEach(function(o){
            var orderId = o.order_id || o.id || '-';
            var date = o.date || o.created_at || o.order_date || '-';
            var total = o.total != null ? o.total : (o.amount != null ? o.amount : 0);
            var status = o.status || '-';
            html += '<div class="order-card"><p><strong>订单号：</strong>'+esc(orderId)+'</p>'
              +'<p><strong>日期：</strong>'+esc(date)+'</p>'
              +'<p><strong>金额：</strong>¥'+esc(total)+'</p>'
              +'<p><strong>状态：</strong>'+esc(status)+'</p></div>';
          });
        } else {
          html += '<div style="padding:16px;text-align:center;font-size:13px;color:var(--text-4)">暂无订单</div>';
        }
        html += '</div>';
        content.innerHTML = html;
      } else {
        var errMsg = (data && data.message) ? data.message : '加载失败';
        content.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-3)">'+esc(errMsg)+'</div>';
      }
    } catch(e){
      content.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-3)">加载失败</div>';
    }
  }
  </script>
</body>
