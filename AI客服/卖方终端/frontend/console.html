<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>控制台 · 金牌客服</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      padding: 32px;
      border: 1px solid #eee;
      border-radius: 16px;
      background: #fafafa;
      text-align: center;
    }
    h1 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
    p { font-size: 13px; color: #666; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      margin: 4px;
    }
    .btn:hover { opacity: 0.9; }
    .btn-ghost {
      background: transparent;
      color: #666;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>控制台</h1>
    <p>请先登录管理后台，登录后可在此查看数据概览、会话管理、快捷回复等。</p>
    <a href="/admin/login" class="btn">去登录</a>
    <a href="/" class="btn btn-ghost">返回主页</a>
  </div>
</body>
</html>
