<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>坐席工作台 - 金牌客服</title>
  <script>(function(){function okCookie(){return document.cookie.split(';').some(function(c){return c.trim().indexOf('ruitalk_session=active')===0});}var t=!1;try{t=!!(localStorage.getItem('rtk_merchant_access')||localStorage.getItem('rtk_access_token')||localStorage.getItem('admin_access_token')||localStorage.getItem('agent_access_token'));}catch(e){}if(!okCookie()||!t)location.replace('/merchant-auth.html');else try{var a=localStorage.getItem('admin_access_token');if(a)sessionStorage.setItem('rtk_access_token',a);else{var m=localStorage.getItem('rtk_merchant_access');if(m)sessionStorage.setItem('rtk_access_token',m);else{var r=localStorage.getItem('rtk_access_token');if(r)sessionStorage.setItem('rtk_access_token',r);}}}catch(e){}})();</script>
  <style>
    /* ─── 设计系统 ─── */
    :root {
      --bg:           #F8F7F4;
      --bg-subtle:    #F0EEEA;
      --bg-hover:     #E8E5E0;
      --surface:      #FFFFFF;
      --surface-2:    #F5F4F1;
      --text-1:       #1A1917;
      --text-2:       #6B6760;
      --text-3:       #9B9690;
      --text-4:       #C8C4BC;
      --border:       #E2DFD8;
      --border-soft:  rgba(0,0,0,0.05);
      --primary:      #1A1917;
      --primary-text: #FFFFFF;
      --accent:       #D4A843;
      --accent-soft:  #FBF3E0;
      --success:      #22C55E;
      --success-soft: #DCFCE7;
      --danger:       #EF4444;
      --danger-soft:  #FEE2E2;
      --warning:      #F59E0B;
      --warning-soft: #FEF3C7;
      --online:       #22C55E;
      --busy:         #F59E0B;
      --away:         #9CA3AF;
      --radius-sm:    6px;
      --radius-md:    10px;
      --radius-lg:    14px;
      --radius-full:  9999px;
      --shadow-sm:    0 1px 3px rgba(0,0,0,0.06);
      --shadow-md:    0 4px 16px rgba(0,0,0,0.08);
      --sidebar-w:    220px;
      --queue-w:      280px;
      --font:         -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
    }
    [data-theme="dark"] {
      --bg:           #141412;
      --bg-subtle:    #1E1D1A;
      --bg-hover:     #262420;
      --surface:      #242320;
      --surface-2:    #1E1D1A;
      --text-1:       #F0EDE8;
      --text-2:       #9B9690;
      --text-3:       #6B6760;
      --text-4:       #4A4740;
      --border:       rgba(255,255,255,0.08);
      --border-soft:  rgba(255,255,255,0.04);
      --primary:      #F0EDE8;
      --primary-text: #141412;
      --accent:       #D4A843;
      --accent-soft:  #2D2510;
      --success-soft: #0D2D1A;
      --danger-soft:  #2D1010;
      --warning-soft: #2D2010;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; font-family:var(--font); font-size:14px; background:var(--bg); color:var(--text-1); -webkit-font-smoothing:antialiased; overflow:hidden; }

    /* ─── 登录页 ─── */
    .login-wrap {
      position:fixed; inset:0; background:var(--bg);
      display:flex; align-items:center; justify-content:center; z-index:999;
    }
    .login-wrap.hidden { display:none; }
    .login-card {
      width:360px; padding:40px 36px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius-lg); box-shadow:var(--shadow-md);
    }
    .login-logo {
      width:44px; height:44px; border-radius:12px;
      background:var(--primary); margin:0 auto 20px;
      display:flex; align-items:center; justify-content:center;
    }
    .login-logo svg { width:22px; height:22px; fill:var(--primary-text); }
    .login-title { font-size:20px; font-weight:600; text-align:center; margin-bottom:4px; }
    .login-sub { font-size:13px; color:var(--text-3); text-align:center; margin-bottom:28px; }
    .login-field { margin-bottom:14px; }
    .login-field label { display:block; font-size:12px; color:var(--text-3); margin-bottom:6px; }
    .login-field input, .login-field select {
      width:100%; height:40px; padding:0 14px;
      background:var(--bg-subtle); border:1px solid var(--border);
      border-radius:var(--radius-md); color:var(--text-1); font-size:14px; font-family:var(--font);
      outline:none; transition:border-color .15s;
    }
    .login-field input:focus, .login-field select:focus { border-color:var(--text-3); }
    .login-btn {
      width:100%; height:42px; margin-top:8px;
      background:var(--primary); color:var(--primary-text);
      border:none; border-radius:var(--radius-full);
      font-size:14px; font-weight:500; font-family:var(--font); cursor:pointer;
      transition:opacity .15s;
    }
    .login-btn:hover { opacity:.85; }
    .login-btn:disabled { opacity:.5; cursor:not-allowed; }
    .login-error { font-size:12px; color:var(--danger); margin-top:8px; text-align:center; min-height:18px; }

    /* ─── 主布局 ─── */
    .app {
      display:flex; height:100vh; overflow:hidden;
    }

    /* 顶部栏 */
    .topbar {
      height:52px; background:var(--surface); border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px 0 20px; flex-shrink:0; position:fixed; top:0; left:0; right:0; z-index:50;
    }
    .topbar-left { display:flex; align-items:center; gap:12px; }
    .topbar-logo { display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--text-1); }
    .topbar-logo-mark { width:28px; height:28px; border-radius:8px; background:var(--primary); display:flex; align-items:center; justify-content:center; }
    .topbar-logo-mark svg { width:15px; height:15px; }
    .topbar-logo-text { font-size:14px; font-weight:600; }
    .topbar-center { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-3); }
    .topbar-center .dot { width:6px; height:6px; border-radius:50%; background:var(--online); }
    .topbar-right { display:flex; align-items:center; gap:8px; }

    /* 状态切换按钮 */
    .status-group { display:flex; gap:2px; background:var(--bg-subtle); border-radius:var(--radius-full); padding:3px; }
    .status-btn {
      padding:5px 12px; border-radius:var(--radius-full); border:none;
      font-size:12px; font-weight:500; font-family:var(--font); cursor:pointer;
      background:transparent; color:var(--text-3); transition:all .15s;
    }
    .status-btn.active { background:var(--surface); color:var(--text-1); box-shadow:var(--shadow-sm); }
    .status-btn.online.active { color:var(--online); }
    .status-btn.busy.active { color:var(--warning); }
    .status-btn.away.active { color:var(--text-3); }

    .agent-info { display:flex; align-items:center; gap:8px; }
    .agent-avatar { width:30px; height:30px; border-radius:50%; background:var(--bg-hover); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:var(--text-2); }
    .agent-name { font-size:13px; font-weight:500; }
    .logout-btn { padding:6px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:transparent; color:var(--text-3); font-size:12px; cursor:pointer; font-family:var(--font); transition:all .15s; }
    .logout-btn:hover { background:var(--bg-hover); color:var(--text-1); }

    /* ─── 左侧边栏 ─── */
    .sidebar {
      width:var(--sidebar-w); flex-shrink:0; background:var(--surface);
      border-right:1px solid var(--border); padding:60px 8px 12px;
      display:flex; flex-direction:column; gap:2px; overflow-y:auto;
    }
    .sidebar-label { font-size:10px; font-weight:600; color:var(--text-4); text-transform:uppercase; letter-spacing:.08em; padding:8px 10px 4px; }
    .nav-item {
      display:flex; align-items:center; gap:9px; padding:8px 10px;
      border-radius:var(--radius-sm); color:var(--text-2); cursor:pointer;
      font-size:13px; transition:all .12s; text-decoration:none;
    }
    .nav-item:hover { background:var(--bg-hover); color:var(--text-1); }
    .nav-item.active { background:var(--bg-subtle); color:var(--text-1); font-weight:500; }
    .nav-item svg { width:15px; height:15px; flex-shrink:0; }

    /* 统计卡片 */
    .stats-row { display:flex; gap:8px; padding:0 4px; margin-top:4px; }
    .stat-card {
      flex:1; background:var(--bg-subtle); border-radius:var(--radius-sm);
      padding:10px 8px; text-align:center; cursor:pointer; transition:all .12s;
    }
    .stat-card:hover { background:var(--bg-hover); }
    .stat-num { font-size:22px; font-weight:700; color:var(--text-1); line-height:1; }
    .stat-num.accent { color:var(--accent); }
    .stat-num.online { color:var(--online); }
    .stat-num.warning { color:var(--warning); }
    .stat-label { font-size:10px; color:var(--text-3); margin-top:3px; }

    /* 在线坐席列表 */
    .agents-online { padding:0 4px; }
    .agent-online-item {
      display:flex; align-items:center; gap:8px; padding:8px 10px;
      border-radius:var(--radius-sm); margin-bottom:2px;
    }
    .agent-online-avatar { width:26px; height:26px; border-radius:50%; background:var(--bg-hover); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; }
    .agent-online-name { flex:1; font-size:12px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .agent-online-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .agent-online-sessions { font-size:10px; color:var(--text-4); }

    /* ─── 中间：客户队列 ─── */
    .queue-panel {
      width:var(--queue-w); flex-shrink:0; background:var(--surface);
      border-right:1px solid var(--border); display:flex; flex-direction:column;
      padding-top:52px;
    }
    .queue-header { padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
    .queue-title { font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
    .queue-badge {
      background:var(--danger); color:#fff; font-size:11px; font-weight:600;
      padding:1px 6px; border-radius:var(--radius-full); min-width:18px; text-align:center;
    }
    .queue-header-actions { display:flex; gap:6px; margin-top:10px; }
    .queue-action-btn {
      flex:1; height:32px; border-radius:var(--radius-sm); border:1px solid var(--border);
      background:transparent; color:var(--text-2); font-size:12px; font-weight:500; cursor:pointer;
      font-family:var(--font); transition:all .12s; display:flex; align-items:center; justify-content:center; gap:5px;
    }
    .queue-action-btn:hover { background:var(--bg-hover); color:var(--text-1); }
    .queue-action-btn.primary { background:var(--primary); color:var(--primary-text); border-color:var(--primary); }
    .queue-action-btn.primary:hover { opacity:.85; }

    .queue-search { padding:10px 12px; border-bottom:1px solid var(--border-soft); flex-shrink:0; }
    .queue-search input {
      width:100%; height:32px; padding:0 10px;
      background:var(--bg-subtle); border:1px solid var(--border);
      border-radius:var(--radius-sm); color:var(--text-1); font-size:13px; font-family:var(--font);
      outline:none;
    }

    .queue-list { flex:1; overflow-y:auto; }
    .queue-item {
      padding:12px 14px; border-bottom:1px solid var(--border-soft);
      cursor:pointer; transition:background .12s; position:relative;
    }
    .queue-item:hover { background:var(--bg-subtle); }
    .queue-item.active { background:var(--accent-soft); border-left:3px solid var(--accent); padding-left:11px; }
    .queue-item.unread::before {
      content:''; position:absolute; top:14px; right:14px;
      width:8px; height:8px; border-radius:50%; background:var(--danger);
    }
    .queue-item-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .queue-item-name { font-size:13px; font-weight:600; color:var(--text-1); }
    .queue-item-time { font-size:11px; color:var(--text-4); }
    .queue-item-preview { font-size:12px; color:var(--text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .queue-item-lang { font-size:10px; background:var(--bg-subtle); color:var(--text-3); padding:1px 6px; border-radius:var(--radius-full); margin-top:4px; display:inline-block; }
    .queue-empty { padding:40px 20px; text-align:center; color:var(--text-4); font-size:13px; }

    /* ─── 右侧：聊天区 ─── */
    .chat-panel {
      flex:1; display:flex; flex-direction:column; padding-top:52px; overflow:hidden;
    }
    .chat-empty {
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      color:var(--text-4); gap:12px;
    }
    .chat-empty-icon { font-size:48px; opacity:.4; }
    .chat-empty-text { font-size:14px; }

    .chat-header {
      padding:12px 18px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0; background:var(--surface);
    }
    .chat-header-left { display:flex; flex-direction:column; gap:2px; }
    .chat-customer-name { font-size:14px; font-weight:600; }
    .chat-customer-meta { font-size:11px; color:var(--text-4); display:flex; align-items:center; gap:6px; }
    .chat-header-actions { display:flex; gap:6px; }
    .chat-action-btn {
      padding:6px 12px; border-radius:var(--radius-sm); border:1px solid var(--border);
      background:transparent; color:var(--text-2); font-size:12px; cursor:pointer;
      font-family:var(--font); transition:all .12s;
    }
    .chat-action-btn:hover { background:var(--bg-hover); color:var(--text-1); }
    .chat-action-btn.danger { color:var(--danger); border-color:var(--danger-soft); background:var(--danger-soft); }
    .chat-action-btn.danger:hover { background:var(--danger); color:#fff; }
    .chat-action-btn.success { color:var(--success); border-color:var(--success-soft); background:var(--success-soft); }
    .chat-action-btn.success:hover { background:var(--success); color:#fff; }

    .chat-messages {
      flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:10px;
      background:var(--bg);
    }
    .chat-msg { display:flex; gap:10px; max-width:72%; }
    .chat-msg.from-me { align-self:flex-end; flex-direction:row-reverse; }
    .chat-msg.from-customer { align-self:flex-start; }
    .chat-msg.from-system { align-self:center; max-width:90%; }
    .msg-avatar { width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
    .from-customer .msg-avatar { background:#1E3A4C; color:#fff; }
    .from-me .msg-avatar { background:var(--primary); color:var(--primary-text); }
    .from-system .msg-avatar { background:transparent; font-size:16px; }
    .msg-body { display:flex; flex-direction:column; gap:3px; }
    .from-me .msg-body { align-items:flex-end; }
    .msg-bubble { padding:9px 13px; border-radius:var(--radius-md); font-size:13px; line-height:1.5; word-break:break-word; }
    .from-customer .msg-bubble { background:var(--surface); border:1px solid var(--border); color:var(--text-1); border-top-left-radius:4px; }
    .from-me .msg-bubble { background:var(--primary); color:var(--primary-text); border-top-right-radius:4px; }
    .from-system .msg-bubble { background:var(--bg-subtle); color:var(--text-3); font-size:12px; text-align:center; border-radius:var(--radius-full); padding:5px 14px; }
    .msg-time { font-size:10px; color:var(--text-4); padding:0 4px; }

    .chat-input-area {
      padding:12px 18px; border-top:1px solid var(--border);
      background:var(--surface); flex-shrink:0;
    }

    /* 翻译预览 - 双语对照视图 */
    .translation-preview {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 10px;
      overflow: hidden;
      animation: slideDown 0.2s ease-out;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .preview-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--accent-soft);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-2);
    }
    .preview-icon { font-size: 12px; }
    .preview-text { font-weight: 500; }
    .preview-loading {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--text-3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .preview-content {
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-2);
      min-height: 24px;
      max-height: 80px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .preview-content.translated {
      color: var(--text-1);
    }
    .preview-error {
      color: var(--danger);
      font-size: 12px;
    }

    .chat-input-row { display:flex; gap:10px; align-items:flex-end; }
    .chat-input {
      flex:1; min-height:38px; max-height:100px; padding:8px 12px;
      background:var(--bg-subtle); border:1px solid var(--border);
      border-radius:var(--radius-md); color:var(--text-1); font-size:13px; font-family:var(--font);
      line-height:1.5; resize:none; outline:none; transition:border-color .15s;
    }
    .chat-input:focus { border-color:var(--text-3); }
    .send-btn {
      height:38px; padding:0 18px; background:var(--primary); color:var(--primary-text);
      border:none; border-radius:var(--radius-md); font-size:13px; font-weight:500;
      cursor:pointer; font-family:var(--font); transition:opacity .15s; flex-shrink:0;
    }
    .send-btn:hover { opacity:.85; }
    .send-btn:disabled { opacity:.5; cursor:not-allowed; }

    /* 快捷回复 */
    .quick-reply-row { display:flex; gap:6px; flex-wrap:wrap; padding:8px 0 0; }
    .quick-reply-btn {
      padding:4px 10px; border-radius:var(--radius-full); border:1px solid var(--border);
      background:var(--bg-subtle); color:var(--text-3); font-size:11px; cursor:pointer;
      font-family:var(--font); transition:all .12s;
    }
    .quick-reply-btn:hover { background:var(--bg-hover); color:var(--text-1); }

    /* Toast */
    .toast {
      position:fixed; bottom:24px; right:24px; z-index:999;
      padding:10px 18px; border-radius:var(--radius-md);
      background:var(--surface); border:1px solid var(--border);
      box-shadow:var(--shadow-md); font-size:13px; color:var(--text-1);
      animation:toastIn .2s ease;
    }
    .toast.error { background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
    .toast.success { background:var(--success-soft); border-color:var(--success); color:var(--success); }
    @keyframes toastIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }

    /* 连接状态指示 */
    .ws-indicator {
      width:8px; height:8px; border-radius:50%;
    }
    .ws-indicator.connected { background:var(--online); box-shadow:0 0 4px var(--online); }
    .ws-indicator.disconnected { background:var(--danger); }
    .ws-fallback-banner {
      position:fixed; top:52px; left:0; right:0;
      background:#FEF3C7; border-bottom:1px solid #FDE68A;
      padding:6px 16px; font-size:12px; color:#92400E;
      display:flex; align-items:center; gap:8px; z-index:49;
    }
    .ws-fallback-banner .dot { width:6px; height:6px; border-radius:50%; background:#F59E0B; flex-shrink:0; }
  </style>
</head>
<body>

<!-- 登录页 -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </div>
    <div class="login-title">坐席工作台</div>
    <div class="login-sub">金牌客服系统 · 实时协作版</div>
    <div class="login-field">
      <label>坐席工号</label>
      <input type="text" id="loginAgentId" placeholder="输入工号，例如 agent001" autocomplete="off" oninput="clearLoginError()">
    </div>
    <div class="login-field">
      <label>坐席名称</label>
      <input type="text" id="loginAgentName" placeholder="显示名称，例如 张三" autocomplete="off" oninput="clearLoginError()">
    </div>
    <div class="login-field">
      <label>角色</label>
      <select id="loginRole">
        <option value="agent">客服</option>
        <option value="manager">运营主管</option>
        <option value="admin">管理员</option>
      </select>
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin().catch(e=>console.error(e))">登录工作台</button>
    <div class="login-error" id="loginError" style="display:none;"></div>

<script>

// ==================== 统一认证工具函数 ====================
function getAuthToken() {
  return localStorage.getItem('agent_access_token') || localStorage.getItem('admin_access_token');
}

function handleUnauthorized() {
  localStorage.removeItem('admin_access_token');
  localStorage.removeItem('admin_refresh_token');
  localStorage.removeItem('agent_access_token');
  localStorage.removeItem('agent_refresh_token');
  alert('登录已过期，请重新登录');
  window.location.href = '/admin/login';
}

// Fetch 拦截器 - 自动添加认证 token 并处理 401
(function() {
  var origFetch = window.fetch;
  window.fetch = function(input, init) {
    init = init || {};
    var url = typeof input === 'string' ? input : input && input.url;
    if (typeof url === 'string' && url.indexOf('/api/') === 0) {
      var token = getAuthToken();
      if (token) {
        var headers = init.headers || {};
        if (headers instanceof Headers) {
          if (!headers.has('Authorization')) {
            headers.set('Authorization', 'Bearer ' + token);
          }
        } else {
          headers['Authorization'] = 'Bearer ' + token;
          init.headers = headers;
        }
      }
    }
    return origFetch.call(this, input, init).then(function(res) {
      if (res.status === 401) {
        var url2 = typeof input === 'string' ? input : (input && input.url);
        if (url2 && url2.indexOf('/api/') === 0) {
          handleUnauthorized();
        }
      }
      return res;
    }).catch(function(e) { return Promise.reject(e); });
  };
})();


/* ── 全局状态 ── */
var currentAgentId = '';
var currentAgentName = '';
var currentRole = 'agent';
var currentSessionId = null;
var ws = null;
var wsHeartbeat = null;
var wsReconnectTimer = null;
var httpPollTimer = null;
var wsAvailable = true;        // true=WS模式, false=HTTP轮询模式
var allSessions = [];           // 所有会话数据
var filteredSessions = [];     // 过滤后的会话
var displayedMsgCount = 0;     // 当前已展示的消息数
var isRefreshing = false;      // 防止轮询和WS同时刷新数据
var receivedMessageIds = {};   // 已接收消息ID集合，用于去重

/* ── 登录 ── */
function esc(t){ var d=document.createElement('div'); d.textContent=String(t??''); return d.innerHTML; }
function showToast(msg, type='default'){
  var el=document.createElement('div');
  el.className='toast'+(type!=='default'?' '+type:'');
  el.textContent=msg; document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3000);
}

function clearLoginError(){
  var err = document.getElementById('loginError');
  if(err){ err.textContent=''; err.style.display='none'; }
}

async function doLogin(){
  var agentId = document.getElementById('loginAgentId').value.trim();
  var agentName = document.getElementById('loginAgentName').value.trim();
  var role = document.getElementById('loginRole').value;
  
  if(!agentId){ document.getElementById('loginError').textContent='请输入坐席工号'; return; }
  if(!agentName){ agentName=agentId; document.getElementById('loginAgentName').value=agentId; }

  currentAgentId = agentId;
  currentAgentName = agentName;
  currentRole = role;

  // 登录到 HTTP API
  try {
    var loginResp = await fetch('/api/agent/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        agent_id: agentId,
        agent_name: agentName,
        role: role
      })
    });
    var loginData = await loginResp.json();
    
    if (loginData.success && loginData.access_token) {
      // 保存 token
      localStorage.setItem('agent_access_token', loginData.access_token);
      localStorage.setItem('agent_refresh_token', loginData.refresh_token || '');
      localStorage.setItem('agent_info', JSON.stringify(loginData.agent || {}));
      try { document.cookie = 'ruitalk_session=active; path=/; SameSite=Lax'; } catch (_e) {}

      // 登录成功，跳转到主界面
      document.getElementById('agentAvatar').textContent = agentName.charAt(0).toUpperCase();
      document.getElementById('agentNameDisplay').textContent = agentName;
      document.getElementById('loginWrap').classList.add('hidden');
      document.getElementById('app').style.display='flex';

      // 显示欢迎消息
      showToast('登录成功，欢迎 ' + agentName + '！', 'success');

      // 初始化 WebSocket
      initAgentSession();
    } else {
      document.getElementById('loginError').textContent = loginData.message || '登录失败';
    }
  } catch(e) {
    console.error('Login error:', e);
    document.getElementById('loginError').textContent = '登录失败: ' + e.message;
  }
}

/* ── 初始化坐席会话（登录成功后调用）── */
async function initAgentSession(){
  // 尝试建立 WebSocket 连接
  var ok = await wsConnect();
  if(ok){
    // WS 连接成功：发送认证消息
    wsSend({type:'auth', agent_id:currentAgentId, agent_name:currentAgentName, role:currentRole});
    startHeartbeat();
    startWsReconnectLoop();
  } else {
    // HTTP 轮询模式：显示 banner 并启动轮询
    var banner = document.getElementById('wsFallbackBanner');
    var text = document.getElementById('wsFallbackText');
    if(banner && text){
      banner.style.display='flex';
      text.textContent = 'WebSocket 不可用，已切换为 HTTP 轮询模式（部分功能可能受限）';
    }
    startHttpPoll();
  }
}

/* ── WebSocket ── */
function wsConnect(){
  return new Promise(function(resolve){
    var proto = window.location.protocol==='https:'?'wss:':'ws:';
    ws = new WebSocket(proto+'//'+window.location.host+'/ws/agent/'+encodeURIComponent(currentAgentId));

    // 超时 5 秒：如果 WS 没连上，直接 resolve(false) 放行
    var wsTimeout = setTimeout(function(){
      if(ws && ws.readyState !== WebSocket.OPEN){
        ws.close();
        resolve(false);
      }
    }, 5000);

    ws.onopen = function(){
      clearTimeout(wsTimeout);
      setWsStatus(true);
      resolve(true);
    };
    ws.onclose = function(){
      clearTimeout(wsTimeout);
      setWsStatus(false);
      // 不在此处自动重连（由 startWsReconnectLoop 统一管理）
    };
    ws.onerror = function(){ /* resolve 走 timeout 逻辑 */ };

    ws.onmessage = function(event){
      try{
        var msg = JSON.parse(event.data);
        handleWsMessage(msg);
      } catch(e){}
    };
  });
}

function wsSend(data){
  if(ws && ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify(data));
  }
}

function startHeartbeat(){
  clearInterval(wsHeartbeat);
  wsHeartbeat = setInterval(function(){
    wsSend({type:'ping'});
  }, 25000);
}

/* ── WS 重连循环（WS 模式下后台尝试重连）── */
function startWsReconnectLoop(){
  clearInterval(wsReconnectTimer);
  wsReconnectTimer = setInterval(function(){
    if(wsAvailable && (!ws || ws.readyState !== WebSocket.OPEN)){
      wsConnect().then(function(ok){
        if(ok){
          clearInterval(wsReconnectTimer);
          // 重连成功：切换回 WS 模式
          wsAvailable = true;
          document.getElementById('wsFallbackBanner').style.display='none';
          wsSend({type:'auth', agent_id:currentAgentId, agent_name:currentAgentName, role:currentRole});
          startHeartbeat();
        }
      });
    }
  }, 15000);
}

/* ── HTTP 轮询（WS 不可用时的降级方案）── */
function startHttpPoll(){
  clearInterval(httpPollTimer);
  httpPollTimer = setInterval(async function(){
    if(wsAvailable) { stopHttpPoll(); return; }
    await refreshQueue();
    // 同时检查当前会话的新消息
    if(currentSessionId){
      await pollSessionMessages(currentSessionId);
    }
  }, 5000);
}

function stopHttpPoll(){
  clearInterval(httpPollTimer);
}

async function pollSessionMessages(sessionId){
  try{
    var r = await fetch('/api/seller/messages/'+encodeURIComponent(sessionId));
    var d = await r.json();
    if(d.success && d.messages && d.messages.length > displayedMsgCount){
      var newMsgs = d.messages.slice(displayedMsgCount);
      newMsgs.forEach(function(m){
        appendMsgBubble(m.role==='seller'?'me':'customer', m.content||'', m.created_at);
      });
      displayedMsgCount = d.messages.length;
    }
  } catch(e){}
}

function setWsStatus(connected){
  var dot = document.getElementById('wsDot');
  var text = document.getElementById('wsStatusText');
  if(connected){
    dot.className='ws-indicator connected';
    text.textContent='已连接';
  } else {
    dot.className='ws-indicator disconnected';
    text.textContent='已断开';
  }
}

/* ── WebSocket 消息处理 ── */
function handleWsMessage(msg){
  var type = msg.type;
  var data = msg.data || {};

  if(type==='auth_success'){
    // 认证成功，更新状态
    updateOnlineAgents(data.online_agents || []);
    updateStats(data.stats || {});
  }
  else if(type==='new_message'){
    // 收到客户新消息 - 添加去重和并发保护
    var msgKey = data.session_id + '_' + (data.id || data.created_at || Date.now());
    if(receivedMessageIds[msgKey]){
      return; // 消息已处理，跳过
    }
    receivedMessageIds[msgKey] = true;
    
    // 仅在非刷新中时更新UI
    if(!isRefreshing){
      if(data.session_id===currentSessionId){
        appendMsgBubble('customer', data.content || data.translated_zh || '', data.created_at);
      }
      // 更新队列中对应项的预览
      updateSessionPreview(data.session_id, data.content || data.translated_zh || '');
      // 未读标记
      if(data.session_id!==currentSessionId){
        markQueueItemUnread(data.session_id);
      }
    }
  }
  else if(type==='session_assigned'){
    // 被分配了新会话
    var sid = data.session_id || data.data?.session_id;
    var history = data.history || data.data?.history || [];
    if(sid){
      loadSessionMessages(sid, true, history);
      refreshQueue();
    }
    showToast('收到新客户会话，已自动接入', 'success');
  }
  else if(type==='session_history'){
    if(data.session_id===currentSessionId){
      loadHistoryMessages(data.messages || []);
    }
  }
  else if(type==='message_sent'){
    // 消息发送确认
    // 可以在这里更新消息状态
  }
  else if(type==='back_to_ai' || type==='session_transferred'){
    // 会话被转回AI或关闭
    if(data.session_id===currentSessionId){
      closeCurrentChat();
      showToast('会话已结束或转回AI', 'default');
    }
    refreshQueue();
  }
  else if(type==='agent_status_changed'){
    updateOnlineAgents(data);
  }
  else if(type==='customer_connected'){
    refreshQueue();
  }
  else if(type==='error'){
    showToast(data.message || '操作失败', 'error');
  }
}

/* ── 坐席状态切换 ── */
function setAgentStatus(status){
  document.querySelectorAll('.status-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelector('.status-btn.'+status).classList.add('active');
  wsSend({type:'set_status', status:status});
}

/* ── 登出 ── */
function doLogout(){
  clearInterval(wsHeartbeat);
  clearInterval(wsReconnectTimer);
  stopHttpPoll();
  if(ws) ws.close();
  currentAgentId=''; currentSessionId=null;
  wsAvailable=true;
  document.getElementById('app').style.display='none';
  document.getElementById('loginWrap').classList.remove('hidden');
  document.getElementById('wsFallbackBanner').style.display='none';
  // 恢复 loginError 样式
  var errEl = document.getElementById('loginError');
  if(errEl){ errEl.style.color=''; errEl.style.display='none'; errEl.textContent=''; }
  setWsStatus(false);
}

/* ── 客户队列 ── */
async function refreshQueue(){
  // 防止与WS同时刷新导致数据冲突
  if(isRefreshing) return;
  isRefreshing = true;

  try{
    var r = await fetch('/api/seller/customers');
    if(!r.ok){
      // 401 等错误，静默忽略（未登录时正常）
      allSessions = [];
      filteredSessions = [];
      renderQueue();
      updateStats({waiting_count:0, total_sessions:0});
      return;
    }
    var d = await r.json();
    if(d.success){
      allSessions = d.customers || d.data || [];
      applyQueueFilter();
      var waiting = allSessions.filter(function(s){ return s.is_ai===false || s.status==='active'; }).length;
      updateStats({waiting_count: waiting, total_sessions: allSessions.length});
      if(currentAgentId){
        try{
          var ar = await fetch('/api/agent/sessions/'+encodeURIComponent(currentAgentId));
          var ad = await ar.json();
          if(ad.success && ad.sessions){
            document.getElementById('statMySessions').textContent = String((ad.sessions||[]).length);
          }
        } catch(e2){}
      }
    }
  } catch(e){}
  finally{
    // 延迟重置标志，确保WS消息有机会处理
    setTimeout(function(){ isRefreshing = false; }, 500);
  }
}

function applyQueueFilter(){
  var q = (document.getElementById('queueSearchInput').value||'').toLowerCase();
  filteredSessions = allSessions.filter(function(s){
    if(!q) return true;
    return (s.customer_name||'').toLowerCase().includes(q) ||
           (s.customer_id||'').toLowerCase().includes(q) ||
           (s.last_message||'').toLowerCase().includes(q);
  });
  renderQueue();
}

function filterQueue(){
  applyQueueFilter();
}

function renderQueue(){
  var list = document.getElementById('queueList');
  if(filteredSessions.length===0){
    list.innerHTML='<div class="queue-empty">暂无等待客户</div>';
    document.getElementById('queueBadge').textContent='0';
    return;
  }
  document.getElementById('queueBadge').textContent = filteredSessions.length;
  var html = '';
  filteredSessions.forEach(function(s){
    var isActive = s.session_id===currentSessionId;
    var hasUnread = s.unread || false;
    var name = esc(s.customer_name || s.customer_id || '客户');
    var preview = esc((s.last_message||'（无消息）').substring(0,40));
    var time = s.updated_at ? formatTime(s.updated_at) : '';
    var lang = s.language ? LANG_NAMES[s.language]||s.language : '';
    html += '<div class="queue-item'+(isActive?' active':'')+(hasUnread?' unread':'')+'" onclick="openSession(\''+s.session_id+'\')">\
      <div class="queue-item-top">\
        <span class="queue-item-name">'+name+'</span>\
        <span class="queue-item-time">'+time+'</span>\
      </div>\
      <div class="queue-item-preview">'+preview+'</div>\
      '+(lang?'<span class="queue-item-lang">'+esc(lang)+'</span>':'')+'\
    </div>';
  });
  list.innerHTML = html;
}

function markQueueItemUnread(sessionId){
  // 修复：正确获取队列列表元素，避免引用未定义的 list 变量
  var list = document.getElementById('queueList');
  if(!list) return;
  var items = list.querySelectorAll('.queue-item');
  var targetItem = null;
  for(var i = 0; i < items.length; i++){
    var onclickAttr = items[i].getAttribute('onclick') || '';
    if(onclickAttr.indexOf(sessionId) !== -1){
      targetItem = items[i];
      break;
    }
  }
  if(targetItem && sessionId !== currentSessionId){
    targetItem.classList.add('unread');
    // 更新徽章计数
    var badge = document.getElementById('queueBadge');
    if(badge){
      badge.textContent = (parseInt(badge.textContent || 0) + 1).toString();
    }
  }
}

function updateSessionPreview(sessionId, content){
  allSessions.forEach(function(s){
    if(s.session_id===sessionId) s.last_message = content;
  });
  applyQueueFilter();
}

/* ── 打开会话 ── */
async function openSession(sessionId){
  if(sessionId===currentSessionId) return;
  currentSessionId = sessionId;
  wsSend({type:'switch_session', session_id:sessionId});
  renderQueue();
  showChatArea();

  // 获取会话基本信息
  var sess = allSessions.find(function(s){ return s.session_id===sessionId; });
  if(sess){
    document.getElementById('chatCustomerName').textContent = esc(sess.customer_name||sess.customer_id||'客户');
    document.getElementById('chatCustomerLang').textContent = LANG_NAMES[sess.language]||sess.language||'-';
    document.getElementById('chatCustomerLevel').textContent = sess.level||'-';
  }
}

async function loadSessionMessages(sessionId, fullReload, preloadedHistory){
  var messagesEl = document.getElementById('chatMessages');
  if(fullReload){
    messagesEl.innerHTML = '';
    displayedMsgCount = 0;
  }
  if(preloadedHistory && Array.isArray(preloadedHistory)){
    preloadedHistory.forEach(function(m){
      appendMsgBubble(m.role==='seller'?'me':'customer', m.content||m.display||'', m.created_at);
    });
  } else {
    try{
      var r = await fetch('/api/seller/messages/'+sessionId);
      var d = await r.json();
      if(d.success && (d.messages || d.data)){
        messagesEl.innerHTML = '';
        displayedMsgCount = 0;
        (d.messages || d.data.messages || []).forEach(function(m){
          appendMsgBubble(m.role==='seller'?'me':'customer', m.content||'', m.created_at);
        });
      }
    } catch(e){}
  }
  scrollToBottom();
}

function loadHistoryMessages(messages){
  var messagesEl = document.getElementById('chatMessages');
  messagesEl.innerHTML = '';
  messages.forEach(function(m){
    appendMsgBubble(m.role==='seller'||m.role==='assistant'?'me':'customer', m.content||m.display||'', m.created_at);
  });
  scrollToBottom();
}

function appendMsgBubble(who, content, time){
  if(!content) return;
  var messagesEl = document.getElementById('chatMessages');
  var avatarChar = who==='me' ? currentAgentName.charAt(0).toUpperCase() : 'C';
  var timeStr = time ? formatTime(time) : formatNow();
  var html = '<div class="chat-msg from-'+who+'">\
    <div class="msg-avatar">'+avatarChar+'</div>\
    <div class="msg-body">\
      <div class="msg-bubble">'+esc(content)+'</div>\
      <div class="msg-time">'+timeStr+'</div>\
    </div>\
  </div>';
  messagesEl.insertAdjacentHTML('beforeend', html);
  scrollToBottom();
}

function appendSystemMsg(content){
  var messagesEl = document.getElementById('chatMessages');
  messagesEl.insertAdjacentHTML('beforeend',
    '<div class="chat-msg from-system"><div class="msg-avatar"></div><div class="msg-body">\
    <div class="msg-bubble">'+esc(content)+'</div></div></div>');
  scrollToBottom();
}

/* ── 发送消息 ── */
async function sendMessage(){
  var input = document.getElementById('chatInput');
  var content = input.value.trim();
  if(!content || !currentSessionId) return;
  input.value = ''; input.style.height='auto';

  // 立即显示自己的消息
  appendMsgBubble('me', content, formatNow());

  if(wsAvailable && ws && ws.readyState===WebSocket.OPEN){
    wsSend({type:'agent_message', session_id:currentSessionId, content:content});
  } else {
    // HTTP 轮询模式：直接调用 REST API
    try{
      await fetch('/api/seller/send', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({session_id:currentSessionId, message:content, message_type:'text'})
      });
    } catch(e){}
  }
}

function onInputKeydown(e){
  if(e.key==='Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

function autoGrow(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,100)+'px';
}

/* ── 双语对照视图：翻译预览 ── */
var _translationTimer = null;
var _lastTranslationContent = '';

function onInputChange(el) {
  // 自动增长输入框
  autoGrow(el);

  // 防抖翻译预览（300ms 后触发）
  clearTimeout(_translationTimer);
  var content = el.value.trim();

  if (!content) {
    hideTranslationPreview();
    return;
  }

  _translationTimer = setTimeout(function() {
    previewTranslation(content);
  }, 300);
}

async function previewTranslation(content) {
  if (!content || !currentSessionId) return;
  if (content === _lastTranslationContent) return;
  _lastTranslationContent = content;

  var previewEl = document.getElementById('translationPreview');
  var contentEl = document.getElementById('translationContent');

  // 显示加载状态
  previewEl.style.display = 'block';
  contentEl.innerHTML = '<span class="preview-loading"></span> 正在翻译...';
  contentEl.classList.remove('translated');

  try {
    var response = await fetch('/api/seller/translate-preview', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        text: content,
        session_id: currentSessionId
      })
    });

    if (!response.ok) throw new Error('翻译请求失败');

    var data = await response.json();

    if (data.success && data.translated_text) {
      contentEl.textContent = data.translated_text;
      contentEl.classList.add('translated');
    } else {
      contentEl.textContent = data.message || '翻译不可用';
      contentEl.classList.add('preview-error');
    }
  } catch (e) {
    console.warn('翻译预览失败:', e);
    contentEl.textContent = '翻译服务暂时不可用';
    contentEl.classList.add('preview-error');
  }
}

function hideTranslationPreview() {
  var previewEl = document.getElementById('translationPreview');
  if (previewEl) {
    previewEl.style.display = 'none';
  }
  _lastTranslationContent = '';
}

// 在发送消息时隐藏预览
async function sendMessage(){
  var input = document.getElementById('chatInput');
  var content = input.value.trim();
  if(!content || !currentSessionId) return;

  } else {
    // HTTP 轮询模式：直接调用 REST API
    try{
      await fetch('/api/seller/send', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({session_id:currentSessionId, message:content, message_type:'text'})
      });
    } catch(e){}

}

/* ── 转AI / 结束会话 ── */
async function transferToAI(){
  if(!currentSessionId) return;
  if(wsAvailable && ws && ws.readyState===WebSocket.OPEN){
    wsSend({type:'transfer_to_ai', session_id:currentSessionId});
  } else {
    try{
      await fetch('/api/seller/transfer-to-ai', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},

      });

  appendSystemMsg('已将会话转回 AI 客服');

async function closeSession(){
  if(!currentSessionId) return;
  try{
    await fetch('/api/seller/close-session', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({session_id:currentSessionId})
    });

  setTimeout(function(){ closeCurrentChat(); refreshQueue(); }, 1000);

function closeCurrentChat(){
  currentSessionId = null;
  document.getElementById('chatArea').style.display='none';
  document.getElementById('chatEmpty').style.display='flex';
  renderQueue();
}

}

/* ── 数据更新 ── */
function updateStats(stats){
  if(stats.waiting_count!==undefined)
    document.getElementById('statWaiting').textContent = stats.waiting_count;
  if(stats.total_sessions!==undefined)
    document.getElementById('statTotalSessions').textContent = stats.total_sessions;
  if(stats.online_agents!==undefined)
    document.getElementById('statOnlineAgents').textContent = stats.online_agents;
  /* 「我的会话」由 refreshQueue 内 /api/agent/sessions 单独刷新，避免误把全店会话数当成我的会话 */
}

function updateOnlineAgents(agents){
  var list = document.getElementById('agentsOnlineList');
  if(!agents || agents.length===0){
    list.innerHTML='<div style="padding:8px 10px; font-size:12px; color:var(--text-4);">暂无在线坐席</div>';
    return;
  }
  var html='';
  agents.forEach(function(a){
    var dotColor = a.status==='online'?'var(--online)':a.status==='busy'?'var(--warning)':'var(--away)';
    html+='<div class="agent-online-item">\
      <div class="agent-online-avatar">'+esc((a.agent_name||a.agent_id||'?').charAt(0).toUpperCase())+'</div>\
      <span class="agent-online-name">'+esc(a.agent_name||a.agent_id)+'</span>\
      <div class="agent-online-dot" style="background:'+dotColor+'"></div>\
      <span class="agent-online-sessions">'+a.session_count+'</span>\
    </div>';
  });
  list.innerHTML=html;
  document.getElementById('statOnlineAgents').textContent = agents.length;
}

/* ── 界面辅助 ── */
function showChatArea(){
  document.getElementById('chatEmpty').style.display='none';
  document.getElementById('chatArea').style.display='flex';
}

function scrollToBottom(){
  var el = document.getElementById('chatMessages');
  if(el) el.scrollTop = el.scrollHeight;
}

/* ── 工具函数 ── */
var LANG_NAMES = {'zh':'中文','en':'English','ar':'العربية','ru':'Русский'};

function formatTime(ts){
  if(!ts) return '';
  try{
    var d = new Date(ts);
    if(isNaN(d.getTime())) return '';
    var h = d.getHours().toString().padStart(2,'0');
    var m = d.getMinutes().toString().padStart(2,'0');
    return h+':'+m;
  } catch(e){ return ''; }
}

function formatNow(){
  var d = new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

refreshQueue();
