<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>审计日志 · RuiTalk</title>
  <script>(function(){function okCookie(){return document.cookie.split(';').some(function(c){return c.trim().indexOf('ruitalk_session=active')===0});}var t=!1;try{t=!!(localStorage.getItem('rtk_merchant_access')||localStorage.getItem('rtk_access_token')||localStorage.getItem('admin_access_token')||localStorage.getItem('agent_access_token'));}catch(e){}if(!okCookie()||!t)location.replace('/merchant-auth.html');else try{var a=localStorage.getItem('admin_access_token');if(a)sessionStorage.setItem('rtk_access_token',a);else{var m=localStorage.getItem('rtk_merchant_access');if(m)sessionStorage.setItem('rtk_access_token',m);else{var r=localStorage.getItem('rtk_access_token');if(r)sessionStorage.setItem('rtk_access_token',r);}}}catch(e){}})();</script>
  <style>
    :root{--bg:#FFFFFF;--bg-subtle:#F9F9F8;--bg-hover:#F4F4F2;--surface:#FFFFFF;--text-1:#34322D;--text-2:#6B6860;--text-3:#9B9890;--text-4:#C4C1B8;--border:#E5E7EB;--border-soft:rgba(0,0,0,0.06);--btn-primary-bg:#1A1A19;--btn-primary-text:#FFFFFF;--radius-sm:8px;--radius-md:12px;--radius-full:9999px;--shadow-sm:0 1px 3px rgba(0,0,0,0.06);--shadow-md:0 4px 16px rgba(0,0,0,0.07);}
    [data-theme="dark"]{--bg:#1A1A18;--bg-subtle:#222220;--bg-hover:#2A2A28;--surface:#242422;--text-1:#F0EFE8;--text-2:#A8A59C;--text-3:#706D64;--text-4:#504D46;--border:rgba(255,255,255,0.08);--border-soft:rgba(255,255,255,0.05);--btn-primary-bg:#F0EFE8;--btn-primary-text:#1A1A18;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"PingFang SC","Hiragino Sans GB",Arial,sans-serif;font-size:14px;line-height:1.6;background:var(--bg);color:var(--text-1);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
    .layout{display:flex;min-height:100vh;}
    .sidebar{width:200px;flex-shrink:0;background:var(--bg-subtle);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;}
    .sidebar-logo{display:flex;align-items:center;gap:9px;padding:18px 16px 14px;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text-1);}
    .sidebar-logo-mark{width:28px;height:28px;border-radius:8px;background:var(--btn-primary-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .sidebar-logo-text{font-size:13px;font-weight:600;}
    .sidebar-nav{flex:1;padding:8px;overflow-y:auto;}
    .snav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;font-size:13px;transition:background .15s,color .15s;margin-bottom:2px;}
    .snav-item:hover{background:var(--bg-hover);color:var(--text-1);}
    .snav-item.active{background:var(--bg-hover);color:var(--text-1);font-weight:500;}
    .snav-item svg{width:15px;height:15px;flex-shrink:0;}
    .sidebar-footer{padding:12px 8px;border-top:1px solid var(--border);}
    .sfooter-btn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--text-3);text-decoration:none;font-size:12px;background:none;border:none;font-family:inherit;cursor:pointer;width:100%;text-align:left;transition:background .15s,color .15s;}
    .sfooter-btn:hover{background:var(--bg-hover);color:var(--text-1);}
    .sfooter-btn svg{width:14px;height:14px;flex-shrink:0;}
    .main-wrap{margin-left:200px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
    .nav{position:sticky;top:0;z-index:50;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--border);}
    .nav-left{display:flex;align-items:center;gap:8px;}
    .nav-logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text-1);text-decoration:none;}
    .nav-logo-mark{width:30px;height:30px;border-radius:9px;background:var(--btn-primary-bg);display:flex;align-items:center;justify-content:center;transition:background .3s;}
    .nav-logo-mark svg{width:17px;height:17px;}
    .nav-sep{width:1px;height:16px;background:var(--border);margin:0 4px;}
    .nav-page-title{font-size:13px;color:var(--text-3);}
    .nav-right{display:flex;align-items:center;gap:8px;}
    .btn-ghost{height:32px;padding:0 14px;background:transparent;border:1px solid rgba(0,0,0,0.10);border-radius:var(--radius-sm);color:var(--text-1);font-size:13px;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s;}
    .btn-ghost:hover{background:var(--bg-hover);}
    .btn-ghost svg{width:14px;height:14px;}
    .page{max-width:1200px;margin:0;padding:24px;width:100%;}
    .page-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
    .page-title{font-size:20px;font-weight:700;color:var(--text-1);}
    .page-desc{font-size:13px;color:var(--text-3);margin-top:4px;}
    .filter-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
    .filter-group{display:flex;flex-direction:column;gap:4px;}
    .filter-label{font-size:11px;color:var(--text-4);letter-spacing:.04em;text-transform:uppercase;}
    .filter-select{height:30px;padding:0 8px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--text-1);font-family:inherit;cursor:pointer;outline:none;}
    .filter-input{height:30px;padding:0 8px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--text-1);font-family:inherit;outline:none;width:140px;}
    .table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    thead th{padding:9px 12px;font-size:11px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;background:var(--bg-subtle);border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;}
    tbody td{padding:11px 12px;font-size:13px;color:var(--text-1);border-bottom:1px solid var(--border);vertical-align:middle;}
    tbody tr:last-child td{border-bottom:none;}
    tbody tr:hover td{background:var(--bg-subtle);}
    .mono{font-family:"SF Mono","Fira Code",monospace;font-size:11px;color:var(--text-3);}
    .badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-full);font-size:11px;font-weight:500;}
    .b-green{background:rgba(34,197,94,.10);color:#16A34A;}
    .b-amber{background:rgba(245,158,11,.10);color:#B45309;}
    .b-blue{background:rgba(59,130,246,.10);color:#2563EB;}
    .b-red{background:rgba(239,68,68,.10);color:#DC2626;}
    .b-gray{background:rgba(107,114,128,.10);color:#374151;}
    .pagination-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border);}
    .page-info{font-size:12px;color:var(--text-4);}
    .page-btns{display:flex;gap:4px;}
    .page-btn{height:26px;min-width:26px;padding:0 7px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--text-2);font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
    .page-btn:hover{background:var(--bg-hover);color:var(--text-1);}
    .page-btn.active{background:var(--btn-primary-bg);border-color:var(--btn-primary-bg);color:var(--btn-primary-text);}
    .page-btn:disabled{opacity:.4;cursor:not-allowed;}
    .empty-state{text-align:center;padding:48px 16px;}
    .empty-state svg{width:40px;height:40px;color:var(--text-4);margin-bottom:8px;}
    .empty-title{font-size:15px;font-weight:600;color:var(--text-2);}
    .empty-desc{font-size:13px;color:var(--text-3);margin-top:4px;}
    @media(max-width:640px){.sidebar{display:none;}.main-wrap{margin-left:0;}.filter-card{flex-direction:column;}.page{padding:16px;}}
  </style>
</head>

<script>
// ==================== 统一认证工具函数 ====================
function getAuthToken() {
  return localStorage.getItem('agent_access_token') || localStorage.getItem('admin_access_token');
}

function handleUnauthorized() {
  localStorage.removeItem('admin_access_token');
  localStorage.removeItem('admin_refresh_token');
  localStorage.removeItem('agent_access_token');
  localStorage.removeItem('agent_refresh_token');
  alert('登录已过期，请重新登录');
  window.location.href = '/admin/login';
}

// 页面加载时检查登录
(function(){
  if (!getAuthToken()) {
    window.location.href = '/admin/login';
  }
})();

(function(){
  var t=localStorage.getItem('theme');
  if(t==='dark')document.documentElement.setAttribute('data-theme','dark');
  var btn=document.getElementById('themeBtn');
  var btn2=document.getElementById('themeBtn2');
  function toggle(){
    var dark=document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme',dark?'':'dark');
    localStorage.setItem('theme',dark?'':'dark');
  }
  if(btn)btn.addEventListener('click',toggle);
  if(btn2)btn2.addEventListener('click',toggle);
})();

var _logs = [], _total = 0, _page = 1, _pageSize = 50;

async function loadLogs(page) {
  _page = page || 1;
  var type = document.getElementById('f-type').value;
  var operator = document.getElementById('f-operator').value.trim();
  var target = document.getElementById('f-target').value;
  var params = new URLSearchParams({page: _page, page_size: _pageSize});
  if (type) params.set('event_type', type);
  if (operator) params.set('operator', operator);
  if (target) params.set('target_type', target);
  try {
    var res = await fetch('/api/admin/audit-logs?' + params.toString(), {
      headers: { 'Authorization': 'Bearer ' + getAuthToken() }
    });
    if (res.status === 401) { handleUnauthorized(); return; }
    var json = await res.json();
    if (json.success) {
      _logs = json.logs || json.list || [];
      _total = json.total || 0;
      renderTable();
      renderPagination();
      renderStats();
    } else {
      document.getElementById('logTable').innerHTML = '<tr><td colspan="7" class="empty-state"><div class="empty-title">加载失败</div><div class="empty-desc">请检查后端服务是否运行</div></td></tr>';
    }
  } catch(e) {
    document.getElementById('logTable').innerHTML = '<tr><td colspan="7" class="empty-state"><div class="empty-title">加载失败</div><div class="empty-desc">网络错误: '+e.message+'</div></td></tr>';
  }
}

function renderTable() {
  var tbody = document.getElementById('logTable');
  if (_logs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:40px;height:40px;color:var(--text-4);margin:0 auto 8px;display:block;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div class="empty-title">暂无日志</div><div class="empty-desc">当前筛选条件下没有审计日志</div></td></tr>';
    return;
  }
  tbody.innerHTML = _logs.map(function(r) {
    var badge = getEventBadge(r.event_type);
    return '<tr>'+
      '<td class="mono">'+fmtTime(r.created_at)+'</td>'+
      '<td><span class="badge '+badge.cls+'">'+r.event_type+'</span></td>'+
      '<td>'+escapeHtml(r.operator||'-')+'</td>'+
      '<td style="color:var(--text-2);font-size:12px;">'+escapeHtml(r.target_type||'-')+'</td>'+
      '<td class="mono" style="font-size:11px;">'+escapeHtml(r.target_id||'-')+'</td>'+
      '<td style="font-size:12px;color:var(--text-2);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+escapeHtml(r.detail||'')+'">'+escapeHtml(r.detail||'-')+'</td>'+
      '<td class="mono" style="font-size:11px;">'+(r.ip_address?'<span style="color:var(--text-4)">'+r.ip_address+'</span>':'<span style="color:var(--text-4)">-</span>')+'</td>'+
    '</tr>';
  }).join('');
}

function renderPagination() {
  var totalPages = Math.ceil(_total / _pageSize) || 1;
  document.getElementById('pageInfo').textContent = '共 '+_total+' 条，第 '+_page+' / '+totalPages+' 页';
  var btns = document.getElementById('pageBtns');
  var html = '';
  html += '<button class="page-btn" onclick="loadLogs('+(_page-1)+')" '+(_page<=1?'disabled':'')+'>‹</button>';
  var start = Math.max(1, _page-2);
  var end = Math.min(totalPages, _page+2);
  if (start > 1) { html += '<button class="page-btn" onclick="loadLogs(1)">1</button>'; if (start > 2) html += '<span style="padding:0 4px;color:var(--text-4)">...</span>'; }
  for (var i=start; i<=end; i++) html += '<button class="page-btn '+(i===_page?'active':'')+'" onclick="loadLogs('+i+')">'+i+'</button>';
  if (end < totalPages) { if (end < totalPages-1) html += '<span style="padding:0 4px;color:var(--text-4)">...</span>'; html += '<button class="page-btn" onclick="loadLogs('+totalPages+')">'+totalPages+'</button>'; }
  html += '<button class="page-btn" onclick="loadLogs('+(_page+1)+')" '+(_page>=totalPages?'disabled':'')+'>›</button>';
  btns.innerHTML = html;
}

function renderStats() {
  var stats = {};
  _logs.forEach(function(r) {
    stats[r.event_type] = (stats[r.event_type]||0)+1;
  });
  var el = document.getElementById('statsRow');
  el.innerHTML = Object.keys(stats).map(function(k) {
    var b = getEventBadge(k);
    return '<div class="badge '+b.cls+'" style="font-size:12px;padding:4px 12px;">'+k+': '+stats[k]+'</div>';
  }).join('');
}

function getEventBadge(type) {
  var map = {
    'CREATE': {cls:'b-green'},
    'UPDATE': {cls:'b-blue'},
    'DELETE': {cls:'b-red'},
    'BATCH': {cls:'b-amber'},
    'LOGIN': {cls:'b-gray'},
    'LOGOUT': {cls:'b-gray'},
  };
  return map[type] || {cls:'b-gray'};
}

function fmtTime(dt) {
  if (!dt) return '-';
  try { return dt.replace('T',' ').slice(0,19); } catch(e) { return dt; }
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  var div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

document.getElementById('f-type').addEventListener('change', function() { loadLogs(1); });
document.getElementById('f-operator').addEventListener('keyup', function(e) { if (e.key==='Enter') loadLogs(1); });
document.getElementById('f-target').addEventListener('change', function() { loadLogs(1); });

loadLogs(1);
</script>
</body>
</html>
