<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>售后服务 · Ruitalk</title>
  <script>(function(){function okCookie(){return document.cookie.split(';').some(function(c){return c.trim().indexOf('ruitalk_session=active')===0});}var t=!1;try{t=!!(localStorage.getItem('rtk_merchant_access')||localStorage.getItem('rtk_access_token')||localStorage.getItem('admin_access_token')||localStorage.getItem('agent_access_token'));}catch(e){}if(!okCookie()||!t)location.replace('/merchant-auth.html');else try{var a=localStorage.getItem('admin_access_token');if(a)sessionStorage.setItem('rtk_access_token',a);else{var m=localStorage.getItem('rtk_merchant_access');if(m)sessionStorage.setItem('rtk_access_token',m);else{var r=localStorage.getItem('rtk_access_token');if(r)sessionStorage.setItem('rtk_access_token',r);}}}catch(e){}})();</script>
  <style>
    :root {
      --bg:#FFFFFF; --bg-subtle:#F9F9F8; --bg-hover:#F4F4F2; --surface:#FFFFFF;
      --text-1:#34322D; --text-2:#6B6860; --text-3:#9B9890; --text-4:#C4C1B8;
      --border:#E5E7EB; --border-soft:rgba(0,0,0,0.06);
      --btn-primary-bg:#1A1A19; --btn-primary-text:#FFFFFF;
      --radius-sm:8px; --radius-md:12px; --radius-lg:22px; --radius-full:9999px;
      --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 16px rgba(0,0,0,0.07);
    }
    [data-theme="dark"] {
      --bg:#1A1A18; --bg-subtle:#222220; --bg-hover:#2A2A28; --surface:#242422;
      --text-1:#F0EFE8; --text-2:#A8A59C; --text-3:#706D64; --text-4:#504D46;
      --border:rgba(255,255,255,0.08); --border-soft:rgba(255,255,255,0.05);
      --btn-primary-bg:#F0EFE8; --btn-primary-text:#1A1A18;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"PingFang SC","Hiragino Sans GB",Arial,sans-serif;font-size:14px;line-height:1.6;background:var(--bg);color:var(--text-1);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
    /* nav */
    .nav{position:sticky;top:0;z-index:50;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:var(--bg);border-bottom:1px solid var(--border);transition:background .3s,border-color .3s;}
    .nav-left{display:flex;align-items:center;gap:8px;}
    .nav-logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text-1);text-decoration:none;}
    .nav-logo-mark{width:30px;height:30px;border-radius:9px;background:var(--btn-primary-bg);display:flex;align-items:center;justify-content:center;transition:background .3s;}
    .nav-logo-mark svg{width:17px;height:17px;}
    .nav-sep{width:1px;height:16px;background:var(--border);margin:0 4px;}
    .nav-page-title{font-size:13px;color:var(--text-3);}
    .nav-right{display:flex;align-items:center;gap:8px;}
    .btn-ghost{height:32px;padding:0 14px;background:transparent;border:1px solid rgba(0,0,0,0.10);border-radius:var(--radius-sm);color:var(--text-1);font-size:13px;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s;}
    .btn-ghost:hover{background:var(--bg-hover);}
    .btn-ghost svg{width:14px;height:14px;}
    /* page */
    .page{max-width:1200px;margin:0;padding:24px 24px 60px;}
    /* stat row */
    .stat-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;transition:border-color .15s;}
    .stat-card:hover{border-color:var(--text-4);}
    .stat-num{font-size:22px;font-weight:700;color:var(--text-1);line-height:1.2;}
    .stat-label{font-size:11px;color:var(--text-4);margin-top:3px;}
    /* tabs */
    .tabs-bar{display:flex;gap:2px;margin-bottom:16px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-md);padding:4px;}
    .tab-btn{height:32px;padding:0 16px;background:transparent;border:none;border-radius:var(--radius-sm);font-size:13px;color:var(--text-3);font-family:inherit;cursor:pointer;transition:background .15s,color .15s;}
    .tab-btn.active{background:var(--surface);color:var(--text-1);font-weight:500;box-shadow:var(--shadow-sm);}
    .tab-pane{display:none;}
    .tab-pane.active{display:block;}
    /* filter */
    .filter-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 18px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
    .filter-group{display:flex;flex-direction:column;gap:4px;}
    .filter-label{font-size:11px;color:var(--text-4);letter-spacing:.04em;text-transform:uppercase;}
    .filter-chips{display:flex;gap:4px;flex-wrap:wrap;}
    .chip{height:26px;padding:0 10px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-full);font-size:12px;color:var(--text-2);font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s,color .15s;display:inline-flex;align-items:center;}
    .chip:hover{background:var(--bg-hover);}
    .chip.active{background:var(--btn-primary-bg);border-color:var(--btn-primary-bg);color:var(--btn-primary-text);}
    .filter-select{height:30px;padding:0 8px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--text-1);font-family:inherit;cursor:pointer;outline:none;}
    .filter-input{height:30px;padding:0 8px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--text-1);font-family:inherit;outline:none;width:140px;}
    .filter-input:focus,.filter-select:focus{border-color:var(--text-3);}
    /* batch bar */
    .batch-bar{display:none;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 16px;margin-bottom:10px;align-items:center;gap:10px;}
    .batch-bar.show{display:flex;}
    /* table */
    .table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    thead th{padding:9px 12px;font-size:11px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;background:var(--bg-subtle);border-bottom:1px solid var(--border);white-space:nowrap;text-align:left;}
    tbody td{padding:11px 12px;font-size:13px;color:var(--text-1);border-bottom:1px solid var(--border);vertical-align:middle;}
    tbody tr:last-child td{border-bottom:none;}
    tbody tr:hover td{background:var(--bg-subtle);}
    .mono{font-family:"SF Mono","Fira Code",monospace;font-size:11px;color:var(--text-3);}
    /* badges */
    .badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--radius-full);font-size:11px;font-weight:500;white-space:nowrap;}
    .b-amber{background:rgba(245,158,11,.10);color:#B45309;}
    .b-blue{background:rgba(59,130,246,.10);color:#2563EB;}
    .b-green{background:rgba(34,197,94,.10);color:#16A34A;}
    .b-gray{background:rgba(107,114,128,.10);color:#374151;}
    .b-red{background:rgba(239,68,68,.10);color:#DC2626;}
    .b-purple{background:rgba(139,92,246,.10);color:#7C3AED;}
    .b-dark{background:var(--btn-primary-bg);color:var(--btn-primary-text);}
    .b-orange{background:rgba(249,115,22,.10);color:#C2410C;}
    [data-theme="dark"] .b-amber{color:#FCD34D;}
    [data-theme="dark"] .b-blue{color:#93C5FD;}
    [data-theme="dark"] .b-green{color:#4ADE80;}
    [data-theme="dark"] .b-red{color:#FCA5A5;}
    [data-theme="dark"] .b-purple{color:#C4B5FD;}
    [data-theme="dark"] .b-orange{color:#FCA5A5;}
    /* empty state */
    .state-cell{padding:40px 16px!important;text-align:center;}
    .state-cell svg{width:32px;height:32px;color:var(--text-4);margin-bottom:8px;}
    .empty-state{display:flex;flex-direction:column;align-items:center;gap:6px;padding:32px 0;}
    .empty-state svg{width:40px;height:40px;color:var(--text-4);margin-bottom:4px;}
    .empty-title{font-size:15px;font-weight:600;color:var(--text-2);}
    .empty-desc{font-size:13px;color:var(--text-3);max-width:400px;line-height:1.6;}
    .empty-action{margin-top:8px;}
    .btn-ghost-sm{height:28px;padding:0 12px;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-2);font-size:12px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-decoration:none;transition:background .15s;}
    .btn-ghost-sm:hover{background:var(--bg-hover);}
    /* pagination */
    .pagination-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border);}
    .page-info{font-size:12px;color:var(--text-4);}
    .page-btns{display:flex;gap:4px;}
    .page-btn{height:26px;min-width:26px;padding:0 7px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--text-2);font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
    .page-btn:hover{background:var(--bg-hover);color:var(--text-1);}
    .page-btn.active{background:var(--btn-primary-bg);border-color:var(--btn-primary-bg);color:var(--btn-primary-text);}
    .page-btn:disabled{opacity:.4;cursor:not-allowed;}
    /* action btns */
    .btn-action{height:26px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background .15s,color .15s;background:transparent;color:var(--text-2);}
    .btn-action:hover{background:var(--bg-hover);color:var(--text-1);}
    .btn-action-primary{background:var(--btn-primary-bg);border-color:var(--btn-primary-bg);color:var(--btn-primary-text);}
    .btn-action-primary:hover{opacity:.88;}
    .btn-action svg{width:12px;height:12px;}
    /* form */
    .form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;margin-bottom:16px;}
    .form-section-title{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
    .form-section-title:first-child{margin-top:0;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
    .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
    .form-group{display:flex;flex-direction:column;gap:4px;}
    .form-group.full{grid-column:1/-1;}
    .form-label-sm{font-size:12px;color:var(--text-3);font-weight:500;}
    .form-input{height:32px;padding:0 10px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;color:var(--text-1);font-family:inherit;outline:none;transition:border-color .15s;}
    .form-input:focus{border-color:var(--text-3);background:var(--surface);}
    .form-select{height:32px;padding:0 10px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;color:var(--text-1);font-family:inherit;outline:none;cursor:pointer;}
    .form-textarea{padding:8px 10px;min-height:70px;resize:vertical;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;color:var(--text-1);font-family:inherit;outline:none;transition:border-color .15s;}
    .form-textarea:focus{border-color:var(--text-3);background:var(--surface);}
    .form-hint{font-size:11px;color:var(--text-4);margin-top:2px;}
    .radio-group{display:flex;flex-wrap:wrap;gap:8px;}
    .radio-item{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-2);cursor:pointer;}
    .info-box{background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--text-2);display:none;}
    .info-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-soft);}
    .info-row:last-child{border-bottom:none;}
    .info-label{color:var(--text-3);}
    /* step progress */
    .step-progress{display:flex;justify-content:space-between;position:relative;margin:16px 0;}
    .step-progress::before{content:'';position:absolute;top:14px;left:0;right:0;height:2px;background:var(--border);z-index:0;}
    .step-item{position:relative;z-index:1;text-align:center;flex:1;}
    .step-circle{width:28px;height:28px;border-radius:50%;background:var(--bg-subtle);border:1px solid var(--border);color:var(--text-3);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:12px;font-weight:600;}
    .step-item.active .step-circle{background:var(--btn-primary-bg);border-color:var(--btn-primary-bg);color:var(--btn-primary-text);}
    .step-item.completed .step-circle{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#16A34A;}
    .step-label{font-size:11px;color:var(--text-4);}
    .step-item.active .step-label{color:var(--text-1);font-weight:500;}
    /* modal */
    .modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);backdrop-filter:blur(2px);align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:760px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md);padding:24px;}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
    .modal-title{font-size:16px;font-weight:600;color:var(--text-1);}
    .modal-close{width:28px;height:28px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-3);transition:background .15s;}
    .modal-close:hover{background:var(--bg-hover);color:var(--text-1);}
    .modal-close svg{width:14px;height:14px;}
    .modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
    .btn-modal-cancel{height:32px;padding:0 14px;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;color:var(--text-2);font-family:inherit;cursor:pointer;transition:background .15s;}
    .btn-modal-cancel:hover{background:var(--bg-hover);}
    .btn-modal-submit{height:32px;padding:0 14px;background:var(--btn-primary-bg);border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--btn-primary-text);font-family:inherit;cursor:pointer;transition:opacity .15s;}
    .btn-modal-submit:hover{opacity:.88;}
    /* detail */
    .detail-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .detail-section{background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;}
    .detail-section-title{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
    .detail-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
    .detail-row:last-child{border-bottom:none;}
    .detail-key{color:var(--text-3);}
    /* timeline */
    .timeline{border-left:2px solid var(--border);padding-left:16px;margin-left:6px;}
    .timeline-item{position:relative;padding-bottom:12px;}
    .timeline-item::before{content:'';position:absolute;left:-20px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--btn-primary-bg);}
    .timeline-time{font-size:11px;color:var(--text-4);}
    .timeline-text{font-size:13px;color:var(--text-2);margin-top:1px;}
    /* state */
    .state-cell{text-align:center;padding:40px 20px;color:var(--text-4);font-size:13px;}
    .state-cell svg{width:28px;height:28px;margin:0 auto 8px;display:block;}
    @media(max-width:900px){.stat-row{grid-template-columns:repeat(3,1fr);}.detail-2col{grid-template-columns:1fr;}}
    @media(max-width:600px){.nav{padding:0 16px;}.page{padding:16px 16px 40px;}.form-row,.form-row-3{grid-template-columns:1fr;}}
  
    /* ─── 侧边栏 ─── */
    .layout{display:flex;min-height:100vh;}
    .sidebar{width:200px;flex-shrink:0;background:var(--bg-subtle);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:background .3s,border-color .3s;}
    .sidebar-logo{display:flex;align-items:center;gap:9px;padding:18px 16px 14px;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text-1);}
    .sidebar-logo-mark{width:28px;height:28px;border-radius:8px;background:var(--btn-primary-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .3s;}
    .sidebar-logo-mark svg{width:15px;height:15px;}
    .sidebar-logo-text{font-size:13px;font-weight:600;letter-spacing:-0.01em;}
    .sidebar-nav{flex:1;padding:8px;overflow-y:auto;}
    .snav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;font-size:13px;transition:background .15s,color .15s;margin-bottom:2px;}
    .snav-item:hover{background:var(--bg-hover);color:var(--text-1);}
    .snav-item.active{background:var(--bg-hover);color:var(--text-1);font-weight:500;}
    .snav-item svg{width:15px;height:15px;flex-shrink:0;}
    .sidebar-footer{padding:12px 8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px;}
    .sfooter-btn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--text-3);text-decoration:none;font-size:12px;background:none;border:none;font-family:inherit;cursor:pointer;width:100%;text-align:left;transition:background .15s,color .15s;}
    .sfooter-btn:hover{background:var(--bg-hover);color:var(--text-1);}
    .sfooter-btn svg{width:14px;height:14px;flex-shrink:0;}
    .main-wrap{margin-left:200px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
    @media(max-width:640px){.sidebar{display:none;}.main-wrap{margin-left:0;}}

  </style>
</head>
<body>
  <script>

// ==================== 统一认证工具函数 ====================
function getAuthToken() {
  return localStorage.getItem('agent_access_token') || localStorage.getItem('admin_access_token');
}

function handleUnauthorized() {
  localStorage.removeItem('admin_access_token');
  localStorage.removeItem('admin_refresh_token');
  localStorage.removeItem('agent_access_token');
  localStorage.removeItem('agent_refresh_token');
  alert('登录已过期，请重新登录');
  window.location.href = '/admin/login';
}

// Fetch 拦截器 - 自动添加认证 token 并处理 401
(function() {
  var origFetch = window.fetch;
  window.fetch = function(input, init) {
    init = init || {};
    var url = typeof input === 'string' ? input : input && input.url;
    if (typeof url === 'string' && url.indexOf('/api/') !== -1) {
      var token = getAuthToken();
      if (token) {
        var headers = init.headers || {};
        if (headers instanceof Headers) {
          if (!headers.has('Authorization')) {
            headers.set('Authorization', 'Bearer ' + token);
          }
        } else {
          headers['Authorization'] = 'Bearer ' + token;
          init.headers = headers;
        }
      }
    }
    return origFetch.call(this, input, init).then(function(res) {
      if (res.status === 401) {
        var url2 = typeof input === 'string' ? input : (input && input.url);
        if (url2 && url2.indexOf('/api/') !== -1) {
          handleUnauthorized();
        }
      }
      if (res.status === 403) {
        var url3 = typeof input === 'string' ? input : (input && input.url);
        if (url3 && url3.indexOf('/api/') !== -1) {
          alert('权限不足（需要管理员或坐席）。请使用坐席登录或管理员账号登录。');
        }
      }
      return res;
    }).catch(function(e) { return Promise.reject(e); });
  };
})();

// 页面加载时检查登录
(function(){
  if (!getAuthToken()) {
    window.location.href = '/admin/login';
  }
})();

(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
  <div class="layout">
    <aside class="sidebar">

            <span class="form-hint">优质客户在此额度内自动退款</span>
          </div>
        </div>
        <div class="form-card">
          <div class="form-section-title">超时提醒设置</div>
          <div class="form-group" style="margin-bottom:10px">
            <label class="form-label-sm">审核超时（小时）</label>
            <input type="number" class="form-input" id="auditTimeout" value="24">
          </div>
          <div class="form-group" style="margin-bottom:10px">
            <label class="form-label-sm">退款超时（小时）</label>
            <input type="number" class="form-input" id="refundTimeout" value="48">
          </div>
          <div class="form-group" style="margin-bottom:10px">
            <label class="form-label-sm">纠纷处理超时（小时）</label>
            <input type="number" class="form-input" id="disputeTimeout" value="72">
          </div>
        </div>
        <div class="form-card">
          <div class="form-section-title">退货地址管理</div>
          <div class="form-group" style="margin-bottom:10px">
            <label class="form-label-sm">国内退货地址</label>
            <textarea class="form-textarea" id="domesticReturnAddr">广东省深圳市龙华区民治街道 联系人和电话</textarea>
          </div>
          <div class="form-group" style="margin-bottom:10px">
            <label class="form-label-sm">海外退货地址</label>
            <textarea class="form-textarea" id="overseasReturnAddr">美国洛杉矶退货地址</textarea>
          </div>
          <button type="button" class="btn-action btn-action-primary" onclick="alert('地址已保存')">保存地址</button>
        </div>
        <div class="form-card">
          <div class="form-section-title">快捷回复模板</div>
          <div class="form-group" style="margin-bottom:10px">
            <label class="form-label-sm">退货确认</label>
            <textarea class="form-textarea">您好，我们已收到您的退货申请，请于7天内将商品寄回至退货地址。</textarea>
          </div>
          <div class="form-group" style="margin-bottom:10px">
            <label class="form-label-sm">退款完成</label>
            <textarea class="form-textarea">您好，您的退款已处理完成，预计3-5个工作日到账，请注意查收。</textarea>
          </div>
          <div class="form-group" style="margin-bottom:10px">
            <label class="form-label-sm">换货发货</label>
            <textarea class="form-textarea">您好，您的换货商品已发出，快递单号：XXX，请注意查收。</textarea>
          </div>
          <button type="button" class="btn-action btn-action-primary" onclick="alert('模板已保存')">保存模板</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">售后单详情</span>
        <button class="modal-close" onclick="closeModal('detailModal')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <!-- 步骤条 -->
      <div class="step-progress" id="detailStepProgress"></div>
      <!-- 内容 -->
      <div class="detail-2col" id="detailContent"></div>
      <div class="modal-footer">
        <button class="btn-modal-cancel" onclick="closeModal('detailModal')">关闭</button>
        <button class="btn-modal-submit" id="detailAdvanceBtn" onclick="updateStatus()">推进状态</button>
      </div>
    </div>
  </div>

  <script>
    let currentPage=1,pageSize=20,totalRecords=0;
    let selectedIds=new Set();
    let currentFilter={status:'全部',type:'全部',platform:'',keyword:''};
    let afterSalesList=[];

    // tab 切换
    function switchTab(id,btn){
      document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active');});
      document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
      document.getElementById('tab-'+id).classList.add('active');
      btn.classList.add('active');
    }

    // modal
    function openModal(id){document.getElementById(id).classList.add('open');}
    function closeModal(id){document.getElementById(id).classList.remove('open');}
    document.querySelectorAll('.modal-overlay').forEach(function(el){
      el.addEventListener('click',function(e){if(e.target===el)el.classList.remove('open');});
    });

    // 事件绑定
    document.addEventListener('DOMContentLoaded',function(){
      loadAfterSales();
      // 状态筛选
      document.querySelectorAll('#statusFilters .chip').forEach(function(btn){
        btn.addEventListener('click',function(){
          document.querySelectorAll('#statusFilters .chip').forEach(function(b){b.classList.remove('active');});
          this.classList.add('active');
          currentFilter.status=this.dataset.status;
          currentPage=1; loadAfterSales();
        });
      });
      // 类型筛选
      document.querySelectorAll('#typeFilters .chip').forEach(function(btn){
        btn.addEventListener('click',function(){
          document.querySelectorAll('#typeFilters .chip').forEach(function(b){b.classList.remove('active');});
          this.classList.add('active');
          currentFilter.type=this.dataset.type;
          currentPage=1; loadAfterSales();
        });
      });
      document.getElementById('platformFilter').addEventListener('change',function(){currentFilter.platform=this.value;currentPage=1;loadAfterSales();});
      document.getElementById('searchKeyword').addEventListener('keyup',function(e){if(e.key==='Enter'){currentFilter.keyword=this.value;currentPage=1;loadAfterSales();}});
      // 售后类型 radio
      document.querySelectorAll('input[name="asType"]').forEach(function(r){
        r.addEventListener('change',function(){
          var sec=document.getElementById('exchangeReshipSection');
          sec.style.display=(this.value==='换货'||this.value==='补发')?'block':'none';
        });
      });
      // 金额计算
      ['refundProductAmount','refundShipping','refundSubsidy','refundCustoms','refundCommission','refundOther'].forEach(function(id){
        document.getElementById(id).addEventListener('input',calculateRefundTotal);
      });
      calculateRefundTotal();
    });

    function calculateRefundTotal(){
      var total=['refundProductAmount','refundShipping','refundSubsidy','refundCustoms','refundCommission','refundOther']
        .reduce(function(s,id){return s+(parseFloat(document.getElementById(id).value)||0);},0);
      document.getElementById('refundTotal').value=total.toFixed(2);
    }

    function fetchOrderInfo(){
      var orderId=document.getElementById('orderId').value.trim();
      if(!orderId){alert('请输入订单号');return;}
      var orderData=afterSalesList.find(function(item){return item.orderId===orderId||item.id===orderId;});
      if(!orderData){
        var idx=parseInt(orderId.replace(/\D/g,''))||Math.floor(Math.random()*100);
        var amountVal=10+((idx*17+31)%190)+(idx%100)/100;
        orderData={customerId:'C'+String(1000+idx).padStart(4,'0'),customerName:'Customer '+(idx+1),products:'Product '+(idx+1),amount:'$'+amountVal.toFixed(2),platform:['amazon','速卖通','temu','shein','shopee','tiktok'][idx%6]};
      }
      document.getElementById('orderCustomerName').textContent=orderData.customerName;
      document.getElementById('orderCustomerId').textContent=orderData.customerId;
      document.getElementById('orderProducts').textContent=orderData.products||'-';
      document.getElementById('orderAmount').textContent=orderData.amount;
      document.getElementById('orderPlatform').value=orderData.platform||'amazon';
      document.getElementById('orderInfoSection').style.display='block';
      var amountNum=parseFloat((orderData.amount||'0').replace(/[^\d.]/g,''))||0;
      document.getElementById('refundProductAmount').value=amountNum.toFixed(2);
      calculateRefundTotal();
    }

    function applySearch(){currentFilter.keyword=(document.getElementById('searchKeyword').value||'').trim();currentPage=1;loadAfterSales();}
    function resetFilters(){
      document.getElementById('searchKeyword').value='';
      currentFilter={status:'全部',type:'全部',platform:'',keyword:''};
      document.querySelectorAll('#statusFilters .chip').forEach(function(b){b.classList.remove('active');if(b.dataset.status==='全部')b.classList.add('active');});
      document.querySelectorAll('#typeFilters .chip').forEach(function(b){b.classList.remove('active');if(b.dataset.type==='全部')b.classList.add('active');});
      document.getElementById('platformFilter').value='';
      currentPage=1; loadAfterSales();
    }

    function filterAfterSalesList(list){
      var filtered=list.slice();
      var status=currentFilter.status,type=currentFilter.type,platform=currentFilter.platform,keyword=(currentFilter.keyword||'').trim().toLowerCase();
      if(status&&status!=='全部'){var sm=status==='待寄回'?'待买家寄回':status;filtered=filtered.filter(function(i){return i.status===sm;});}
      if(type&&type!=='全部') filtered=filtered.filter(function(i){return i.type===type;});
      if(platform) filtered=filtered.filter(function(i){return (i.platform||'')===platform;});
      if(keyword) filtered=filtered.filter(function(i){return (i.orderId||'').toLowerCase().indexOf(keyword)!==-1||(i.customerId||'').toLowerCase().indexOf(keyword)!==-1||(i.customerName||'').toLowerCase().indexOf(keyword)!==-1;});
      return filtered;
    }

    /** 将接口 after_sales 行转为与列表一致的记录（供筛选/导出共用） */
    function mapAfterSalesRows(rawList) {
      if (!rawList || !rawList.length) return [];
      return rawList.map(function (r) {
        var amt = parseFloat(r.refund_total || 0);
        var ct = (r.created_at != null ? String(r.created_at) : '').slice(0, 19).replace('T', ' ');
        return {
          id: r.as_id,
          orderId: r.order_id || '',
          customerName: r.customer_name || '—',
          customerId: r.customer_id || '—',
          platform: r.platform || '—',
          type: r.type || '—',
          status: r.status || '—',
          amount: amt.toFixed(2),
          warehouse: r.warehouse || '—',
          risk: (r.reason_category === '恶意买家' || r.reason_category === '欺诈') ? '高风险' : '正常',
          createTime: ct || '—',
          reason_category: r.reason_category || '',
          refund_method: r.refund_method || ''
        };
      });
    }

    async function loadAfterSales(){
      var tbody=document.getElementById('asTableBody');
      tbody.innerHTML='<tr><td colspan="12" class="state-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>加载中…</td></tr>';
      try {
        var apiData = null;
        var resp = await fetch('/api/admin/after-sales?page=' + currentPage + '&page_size=' + pageSize);
        var json = await resp.json();
        if (json.success) {
          apiData = json;
        } else {
          // API 返回错误或未配置
          afterSalesList = [];
          totalRecords = 0;
          renderAfterSalesTable([]);
          renderPagination();
          updateStatistics({total:0, pending:0, returning:0, qc:0, refund:0, completed:0});
          tbody.innerHTML = '<tr><td colspan="12" class="state-cell"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div class="empty-title">暂无售后单数据</div><div class="empty-desc">' + (json.message || '当前没有售后单数据，请检查电商平台 API 配置。') + '</div></div></td></tr>';
          return;
        }

        // API 返回成功，使用真实数据（兼容仅返回 after_sales 的旧接口）
        afterSalesList = apiData.list || [];
        if (!afterSalesList.length && apiData.after_sales && apiData.after_sales.length) {
          afterSalesList = mapAfterSalesRows(apiData.after_sales);
        }
        totalRecords = apiData.total || afterSalesList.length;
        var filteredList = filterAfterSalesList(afterSalesList);
        renderAfterSalesTable(filteredList.slice(0, pageSize));
        renderPagination();
        updateStatistics(apiData.stats || {});
      } catch(err){
        // 网络错误或其他异常
        afterSalesList = [];
        totalRecords = 0;
        renderAfterSalesTable([]);
        renderPagination();
        updateStatistics({total:0, pending:0, returning:0, qc:0, refund:0, completed:0});
        tbody.innerHTML = '<tr><td colspan="12" class="state-cell"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div class="empty-title">加载失败</div><div class="empty-desc">无法连接到服务器，请检查网络连接后刷新重试。</div></div></td></tr>';
      }
    }

    function renderAfterSalesTable(data){
      var tbody=document.getElementById('asTableBody');
      if(!data||data.length===0){tbody.innerHTML='<tr><td colspan="12" class="state-cell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>暂无售后单数据</td></tr>';return;}
      tbody.innerHTML=data.map(function(item){
        return '<tr><td><input type="checkbox" class="as-checkbox" value="'+item.id+'" onchange="toggleSelect(\''+item.id+'\')"></td><td><a href="javascript:void(0)" onclick="showAsDetail(\''+item.id+'\')" style="color:var(--text-1);text-decoration:none;font-family:\'SF Mono\',monospace;font-size:11px">'+item.id+'</a></td><td class="mono">'+item.orderId+'</td><td><div style="font-weight:500">'+item.customerName+'</div><div style="font-size:11px;color:var(--text-4)">'+item.customerId+'</div></td><td>'+platformBadge(item.platform)+'</td><td>'+typeBadge(item.type)+'</td><td>'+statusBadge(item.status)+'</td><td style="font-weight:600">$'+item.amount+'</td><td style="font-size:12px;color:var(--text-3)">'+item.warehouse+'</td><td>'+(item.risk==='高风险'?'<span class="badge b-red">高风险</span>':'<span class="badge b-green">正常</span>')+'</td><td style="font-size:11px;color:var(--text-4)">'+item.createTime+'</td><td style="white-space:nowrap"><button class="btn-action" onclick="showAsDetail(\''+item.id+'\')" title="查看"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button> <button class="btn-action" onclick="updateStatus(\''+item.id+'\')" title="推进"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><polyline points="9 18 15 12 9 6"/></svg></button></td></tr>';
      }).join('');
    }

    function statusBadge(s){var map={'待审核':'b-amber','待买家寄回':'b-blue','待签收':'b-blue','待质检':'b-purple','待退款':'b-red','完成':'b-green','已关闭':'b-gray'};return '<span class="badge '+(map[s]||'b-gray')+'">'+s+'</span>';}
    function typeBadge(t){var map={'退货':'b-red','退款':'b-amber','换货':'b-blue','补发':'b-green','维修':'b-purple','拒收':'b-gray'};return '<span class="badge '+(map[t]||'b-gray')+'">'+t+'</span>';}
    function platformBadge(p){var map={'amazon':'b-dark','速卖通':'b-orange','temu':'b-dark','shein':'b-red','shopee':'b-orange','tiktok':'b-dark'};var label={'amazon':'Amazon','速卖通':'速卖通','temu':'Temu','shein':'SHEIN','shopee':'Shopee','tiktok':'TikTok'};return '<span class="badge '+(map[p]||'b-gray')+'">'+(label[p]||p)+'</span>';}

    function updateStatistics(stats){
      document.getElementById('stat-total').textContent=stats.total;
      document.getElementById('stat-pending').textContent=stats.pending;
      document.getElementById('stat-returning').textContent=stats.returning;
      document.getElementById('stat-qc').textContent=stats.qc;
      document.getElementById('stat-refund').textContent=stats.refund;
      document.getElementById('stat-completed').textContent=stats.completed;
    }

    function renderPagination(){
      var totalPages=Math.ceil(totalRecords/pageSize);
      document.getElementById('pageInfo').textContent='共 '+totalRecords+' 条';
      var pg=document.getElementById('pagination');
      if(totalPages<=1){pg.innerHTML='';return;}
      var html='<button class="page-btn" '+(currentPage===1?'disabled':'')+' onclick="goToPage('+(currentPage-1)+')">‹</button>';
      for(var i=1;i<=totalPages;i++){
        if(i===1||i===totalPages||(i>=currentPage-2&&i<=currentPage+2)){html+='<button class="page-btn '+(i===currentPage?'active':'')+'" onclick="goToPage('+i+')">'+i+'</button>';}
        else if(i===currentPage-3||i===currentPage+3){html+='<span class="page-btn" style="cursor:default">…</span>';}
      }
      html+='<button class="page-btn" '+(currentPage>=totalPages?'disabled':'')+' onclick="goToPage('+(currentPage+1)+')">›</button>';
      pg.innerHTML=html;
    }
    function goToPage(p){currentPage=p;loadAfterSales();window.scrollTo(0,0);}

    function toggleSelect(id){if(selectedIds.has(id))selectedIds.delete(id);else selectedIds.add(id);updateBatchActions();}
    function toggleSelectAll(){var sel=document.getElementById('selectAll').checked;document.querySelectorAll('.as-checkbox').forEach(function(cb){cb.checked=sel;if(sel)selectedIds.add(cb.value);else selectedIds.delete(cb.value);});updateBatchActions();}
    function updateBatchActions(){var ba=document.getElementById('batchActions');document.getElementById('selectedCount').textContent=selectedIds.size;if(selectedIds.size>0)ba.classList.add('show');else ba.classList.remove('show');}
    function clearSelection(){selectedIds.clear();document.getElementById('selectAll').checked=false;document.querySelectorAll('.as-checkbox').forEach(function(cb){cb.checked=false;});updateBatchActions();}
    async function batchOperation(op){
      if(selectedIds.size===0){alert('请先选择要操作的售后单');return;}
      if(!confirm('确定要对 '+selectedIds.size+' 个售后单执行「'+op+'」操作吗？'))return;
      var actionMap = {
        '通过审核': 'approve',
        '生成退货单': 'generate_return',
        '开始退款': 'process_refund'
      };
      var action = actionMap[op] || op;
      try {
        var resp = await fetch('/api/admin/after-sales/batch',{
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            ids: Array.from(selectedIds),
            action: action
          })
        });
        var result = await resp.json();
        if(result.success){
          alert('批量操作成功：' + (result.message || '已处理 ' + selectedIds.size + ' 个售后单'));
          clearSelection();
          loadAfterSales();
        } else {
          alert('批量操作失败：' + (result.message || '未知错误'));
        }
      } catch(err){
        alert('批量操作失败：' + err.message);
      }
    }

    async function showAsDetail(id){
      try {
        var resp = await fetch('/api/admin/after-sales/' + encodeURIComponent(id));
        var json = await resp.json();
        var as;
        if (json.success && json.data) {
          as = json.data;
        } else {
          // Fallback: 从本地列表查找
          as = afterSalesList.find(function(item){return item.id===id;});
          if (!as) {
            alert('未找到该售后单详情');
            return;
          }
        }

        // 步骤条
        var steps=['待审核','待买家寄回','待签收','待质检','待退款','完成'];
        var curIdx=steps.indexOf(as.status);
        var spEl=document.getElementById('detailStepProgress');
        spEl.innerHTML=steps.map(function(s,i){
          var cls=i<curIdx?'completed':i===curIdx?'active':'';
          return '<div class="step-item '+cls+'"><div class="step-circle">'+(i<curIdx?'✓':(i+1))+'</div><div class="step-label">'+s+'</div></div>';
        }).join('');
        // 内容
        var amount=parseFloat(as.amount) || parseFloat(as.refund_total) || 0;
        var refundBreakdown = as.refund_breakdown || {};
        var html='<div class="detail-section"><div class="detail-section-title">基本信息</div>';
        [['售后单号',as.id || as.after_sales_id],['订单号',as.order_id || as.orderId||'—'],['客户',(as.customer_name||as.customerName||'—')+' ('+(as.customer_id||as.customerId||'—')+')'],['平台',platformBadge(as.platform)],['类型',typeBadge(as.type||as.after_sales_type)],['状态',statusBadge(as.status)],['原因',as.reason||as.reason_category||'—']].forEach(function(r){html+='<div class="detail-row"><span class="detail-key">'+r[0]+'</span><span>'+r[1]+'</span></div>';});
        html+='</div><div class="detail-section"><div class="detail-section-title">退款明细</div>';
        [['商品金额','$'+(refundBreakdown.product_amount||refundBreakdown.product||(amount*.8)).toFixed(2)],['运费','$'+(refundBreakdown.shipping||(amount*.1)).toFixed(2)],['补贴','$'+(refundBreakdown.subsidy||0).toFixed(2)],['关税','$'+(refundBreakdown.customs||(amount*.05)).toFixed(2)],['佣金','$'+(refundBreakdown.commission||(amount*.05)).toFixed(2)],['退款总额','$'+(as.refund_total||as.amount||0).toFixed(2)]].forEach(function(r){html+='<div class="detail-row"><span class="detail-key">'+r[0]+'</span><span style="font-weight:500">'+r[1]+'</span></div>';});
        html+='</div><div class="detail-section"><div class="detail-section-title">仓库信息</div>';
        [['仓库',as.warehouse||'待分配'],['入库状态',as.warehouse_status?'<span class="badge b-green">已入库</span>':'<span class="badge b-amber">待入库</span>'],['质检结果',as.qc_result||'待质检']].forEach(function(r){html+='<div class="detail-row"><span class="detail-key">'+r[0]+'</span><span>'+r[1]+'</span></div>';});
        // 物流时间线
        var timelineData = as.timeline || as.logistics_timeline || [];
        if (timelineData.length > 0) {
          html+='</div><div class="detail-section"><div class="detail-section-title">物流时间线</div><div class="timeline">';
          timelineData.forEach(function(t){html+='<div class="timeline-item"><div class="timeline-time">'+t.time+'</div><div class="timeline-text">'+t.event+'</div></div>';});
          html+='</div></div>';
        } else {
          html+='</div>';
        }
        document.getElementById('detailContent').innerHTML=html;
        document.getElementById('detailAdvanceBtn').setAttribute('data-id',as.id||as.after_sales_id);
        openModal('detailModal');
      } catch(err){
        alert('加载详情失败：' + err.message);
      }
    }

    async function updateStatus(id){
      if(!id){var btn=document.getElementById('detailAdvanceBtn');id=btn&&btn.getAttribute('data-id');}
      var statusFlow=['待审核','待买家寄回','待签收','待质检','待退款','完成'];
      var currentAs=afterSalesList.find(function(item){return item.id===id;});
      if(!currentAs){alert('未找到该售后单');return;}
      var ci=statusFlow.indexOf(currentAs.status);
      if(ci>=statusFlow.length-1){alert('该售后单已完成，无法继续推进');return;}
      var nextStatus=statusFlow[ci+1];
      if(!confirm('确定要将状态从「'+currentAs.status+'」推进到「'+nextStatus+'」吗？'))return;
      try {
        var resp = await fetch('/api/admin/after-sales/' + encodeURIComponent(id) + '/status',{
          method: 'PUT',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({status: nextStatus})
        });
        var result = await resp.json();
        if(result.success){
          alert('状态已更新为：'+nextStatus);
          closeModal('detailModal');
          loadAfterSales();
        } else {
          alert('更新失败：'+(result.message||'未知错误'));
        }
      } catch(err){
        alert('更新失败：'+err.message);
      }
    }

    function createAfterSales(e){
      e.preventDefault();
      var formData={orderId:document.getElementById('orderId').value,platform:document.getElementById('orderPlatform').value,type:document.querySelector('input[name="asType"]:checked')?.value,reasonCategory:document.getElementById('asReasonCategory').value,reason:document.getElementById('asReason').value,refundTotal:document.getElementById('refundTotal').value};
      if(!formData.orderId||!formData.type||!formData.reason){alert('请填写必填项');return;}
      alert('售后单创建成功！');
      resetCreateForm();
      document.querySelectorAll('.tab-btn')[0].click();
      loadAfterSales();
    }

    function resetCreateForm(){
      document.getElementById('createAsForm').reset();
      document.getElementById('orderInfoSection').style.display='none';
      document.getElementById('exchangeReshipSection').style.display='none';
      calculateRefundTotal();
    }

    // 主题切换
    (function(){
      var btn=document.getElementById('themeBtn');
      function apply(t){if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');btn.textContent='浅色';}else{document.documentElement.removeAttribute('data-theme');btn.textContent='深色';}}
      apply(localStorage.getItem('theme')||'light');
      btn.addEventListener('click',function(){var cur=document.documentElement.getAttribute('data-theme');var next=cur==='dark'?'light':'dark';apply(next);localStorage.setItem('theme',next);});
    })();
  </script>
    </div>
  </div>

  <script>
    (function(){
      var btn2=document.getElementById('themeBtn2');
      if(btn2){
        function applyTheme(t){if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');if(btn2)btn2.lastChild.textContent=' 浅色模式';}else{document.documentElement.removeAttribute('data-theme');if(btn2)btn2.lastChild.textContent=' 深色模式';}}
        applyTheme(localStorage.getItem('theme')||'light');
        btn2.addEventListener('click',function(){var cur=document.documentElement.getAttribute('data-theme');var next=cur==='dark'?'light':'dark';applyTheme(next);localStorage.setItem('theme',next);});
      }
    })();
  </script>

  <!-- 通知弹窗 -->
  <div id="notifPanel" style="display:none;position:fixed;top:60px;right:24px;z-index:600;width:360px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.12);max-height:480px;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);">
      <span style="font-size:14px;font-weight:600;color:var(--text-1);">通知中心</span>
      <button onclick="document.getElementById('notifPanel').style.display='none'" style="background:none;border:none;cursor:pointer;color:var(--text-3);font-size:18px;line-height:1;">&times;</button>
    </div>
    <div id="notifList" style="padding:8px 0;"></div>
  </div>

  <script>
  // 通知系统
  async function loadNotifications() {
    try {
      const res = await fetch('/api/admin/notifications?page_size=20');
      const json = await res.json();
      if (json.success && json.list) {
        const badge = document.getElementById('notifBadge');
        const countRes = await fetch('/api/admin/notifications/unread-count');
        const countJson = await countRes.json();
        if (countJson.count > 0) {
          badge.textContent = countJson.count > 99 ? '99+' : countJson.count;
          badge.style.display = 'block';
        }
        const panel = document.getElementById('notifList');
        if (json.list.length === 0) {
          panel.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-4);font-size:13px;">暂无通知</div>';
        } else {
          panel.innerHTML = json.list.map(n => `
            <div style="padding:10px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer;${n.is_read ? 'opacity:0.6' : ''}" onclick="markRead(${n.id},this)">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
                <span style="font-size:13px;font-weight:${n.is_read ? '400' : '500'};color:var(--text-1);">${escapeHtml(n.title)}</span>
                <span style="font-size:11px;color:var(--text-4);">${timeAgo(n.created_at)}</span>
              </div>
              <div style="font-size:12px;color:var(--text-3);">${escapeHtml(n.content || '')}</div>
            </div>
          `).join('');
        }
      }
    } catch(e) { console.warn('通知加载失败:', e); }
  }

  async function markRead(id, el) {
    try {
      await fetch(`/api/admin/notifications/${id}/read`, {method:'POST'});
      el.style.opacity = '0.6';
      const badge = document.getElementById('notifBadge');
      const n = parseInt(badge.textContent) - 1;
      badge.textContent = n > 0 ? n : 0;
      if (n <= 0) badge.style.display = 'none';
    } catch(e) {}
  }

  function showNotifs() {
    const panel = document.getElementById('notifPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    if (panel.style.display === 'block') loadNotifications();
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function timeAgo(dt) {
    if (!dt) return '';
    const d = new Date(dt.replace(' ', 'T'));
    const diff = Date.now() - d.getTime();
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
    return Math.floor(diff/86400000) + '天前';
  }

  // 高级统计加载
  async function refreshStats() {
    try {
      const res = await fetch('/api/admin/advanced-stats');
      const json = await res.json();
      if (json.success && json.stats) {
        const s = json.stats;
        document.getElementById('stat-pending').textContent = s.pending_after_sales || 0;
        // 更新其他统计
        const el = document.getElementById('stat-total');
        if (el) el.textContent = s.total_customers || 0;
        // 重新获取售后统计
        loadStats();
      }
    } catch(e) { console.warn('高级统计加载失败:', e); }
  }

  // 导出 CSV（原先用 window._allAfterSales 从未赋值导致恒为空；现按筛选条件拉取足够页大小后导出）
  async function exportCSV() {
    try {
      var limit = Math.min(2000, Math.max(totalRecords || 0, afterSalesList.length || 0, 50));
      var res = await fetch('/api/admin/after-sales?page=1&page_size=' + limit);
      var json = await res.json();
      if (!json.success) {
        alert(json.message || '获取数据失败');
        return;
      }
      var list = [];
      if (json.after_sales && json.after_sales.length) {
        list = mapAfterSalesRows(json.after_sales);
      } else {
        list = (json.list || []).map(function (r) {
          return {
            id: r.id,
            orderId: r.orderId || '',
            customerName: r.customerName || '—',
            customerId: r.customerId || '—',
            platform: r.platform || '—',
            type: r.type || '—',
            status: r.status || '—',
            amount: r.amount || '0',
            warehouse: r.warehouse || '—',
            risk: r.risk || '正常',
            createTime: r.createTime || '—',
            reason_category: '',
            refund_method: ''
          };
        });
      }
      var rows = filterAfterSalesList(list);
      if (rows.length === 0) {
        alert('暂无数据可导出');
        return;
      }
      var headers = ['售后单号','订单号','平台','客户','客户ID','类型','原因','状态','退款金额','退款方式','仓库','风险','创建时间'];
      var csv = [headers.join(',')];
      rows.forEach(function (r) {
        var line = [
          r.id,
          r.orderId,
          r.platform,
          r.customerName,
          r.customerId,
          r.type,
          r.reason_category || '',
          r.status,
          r.amount,
          r.refund_method || '',
          r.warehouse,
          r.risk,
          r.createTime
        ].map(function (v) {
          return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
        });
        csv.push(line.join(','));
      });
      var blob = new Blob(['\ufeff' + csv.join('\n')], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '售后单_' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      alert('导出失败：' + (e.message || '网络错误'));
    }
  }

  // 页面加载时获取通知
  document.addEventListener('DOMContentLoaded', function() {
    loadNotifications();
    // 每60秒刷新一次通知
    setInterval(loadNotifications, 60000);
  });

  // 点击外部关闭通知面板
  document.addEventListener('click', function(e) {
    const panel = document.getElementById('notifPanel');
    const btn = document.getElementById('notifBtn');
    if (panel && panel.style.display === 'block' &&
        !panel.contains(e.target) && !btn.contains(e.target)) {
      panel.style.display = 'none';
    }
  });
  </script>
</body>
</html>
