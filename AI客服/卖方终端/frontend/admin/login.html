<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>登录 · Ruitalk</title>
  <style>
    :root{--bg:#FFFFFF;--bg-subtle:#F9F9F8;--bg-hover:#F4F4F2;--surface:#FFFFFF;--text-1:#34322D;--text-2:#6B6860;--text-3:#9B9890;--text-4:#C4C1B8;--border:#E5E7EB;--border-soft:rgba(0,0,0,0.06);--btn-primary-bg:#1A1A19;--btn-primary-text:#FFFFFF;--radius-sm:8px;--radius-md:12px;--radius-lg:22px;--radius-full:9999px;}
    [data-theme="dark"]{--bg:#1A1A18;--bg-subtle:#222220;--bg-hover:#2A2A28;--surface:#242422;--text-1:#F0EFE8;--text-2:#A8A59C;--text-3:#706D64;--text-4:#504D46;--border:rgba(255,255,255,0.08);--border-soft:rgba(255,255,255,0.05);--btn-primary-bg:#F0EFE8;--btn-primary-text:#1A1A18;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"PingFang SC","Hiragino Sans GB",Arial,sans-serif;font-size:14px;background:var(--bg);color:var(--text-1);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
    /* nav */
    .nav{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);position:relative;z-index:200;}
    .nav-logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text-1);text-decoration:none;}
    .nav-logo-mark{width:26px;height:26px;border-radius:7px;background:var(--btn-primary-bg);display:flex;align-items:center;justify-content:center;}
    .nav-logo-mark svg{width:14px;height:14px;}
    .btn-ghost-sm{height:30px;padding:0 12px;background:transparent;border:1px solid var(--border-soft);border-radius:var(--radius-sm);color:var(--text-3);font-size:12px;font-family:inherit;cursor:pointer;transition:background .15s,color .15s;position:relative;z-index:201;}
    .btn-ghost-sm:hover{background:var(--bg-hover);color:var(--text-1);}
    /* main */
    .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;position:relative;z-index:10;}
    .login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
    .card-header{padding:24px 20px 16px;border-bottom:1px solid var(--border);text-align:center;}
    .card-title{font-size:16px;font-weight:600;color:var(--text-1);margin-bottom:4px;}
    .card-desc{font-size:12px;color:var(--text-3);}
    .card-body{padding:20px;}
    .form-group{margin-bottom:14px;}
    .form-label{font-size:12px;color:var(--text-3);margin-bottom:6px;display:block;font-weight:500;}
    .form-input{width:100%;height:36px;padding:0 12px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;color:var(--text-1);font-family:inherit;outline:none;transition:border-color .15s;}
    .form-input:focus{border-color:var(--text-3);}
    .form-input::placeholder{color:var(--text-4);}
    .error-msg{display:none;font-size:12px;color:#DC2626;margin-bottom:12px;text-align:center;}
    [data-theme="dark"] .error-msg{color:#FCA5A5;}
    .card-footer{padding:0 20px 16px;display:flex;flex-direction:column;gap:8px;}
    .btn-primary-full{width:100%;height:36px;background:var(--btn-primary-bg);border:none;border-radius:var(--radius-sm);color:var(--btn-primary-text);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .15s;position:relative;z-index:10;}
    .btn-primary-full:hover{opacity:.88;}
    .btn-primary-full:disabled{opacity:.4;cursor:not-allowed;}
    .notice{padding:8px 12px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;color:var(--text-3);text-align:center;}
    .back-link{margin-top:20px;font-size:12px;color:var(--text-3);text-decoration:none;transition:color .15s;position:relative;z-index:10;}
    .back-link:hover{color:var(--text-1);}
    /* canvas */
    #star-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:1;display:none;}
  </style>
</head>
<body>
  <script>(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>

  <canvas id="star-canvas"></canvas>

  <nav class="nav">
    <a href="/" class="nav-logo">
      <div class="nav-logo-mark">
        <svg viewBox="0 0 17 17" fill="none"><path d="M8.5 2C6.8 2 5.4 3 4.8 4.4C4.2 4.1 3.5 4 2.8 4.3C1.8 4.7 1.2 5.8 1.4 6.9C0.7 7.4 0.3 8.2 0.5 9.1C0.7 10 1.5 10.6 2.4 10.7C2.6 11.7 3.3 12.5 4.3 12.8C4.8 14.1 6 15 7.5 15C8 15 8.5 14.9 8.9 14.7C9.3 14.9 9.8 15 10.3 14.9C11.6 14.7 12.6 13.6 12.6 12.3C13.5 12 14.2 11.2 14.3 10.2C15.1 9.9 15.6 9.1 15.5 8.2C15.4 7.3 14.7 6.6 13.9 6.4C13.8 5.3 13.1 4.4 12.1 4C11.5 2.8 10.1 2 8.5 2Z" fill="currentColor" style="color:var(--btn-primary-text)"/></svg>
      </div>
      拓岳科技
    </a>
    <button class="btn-ghost-sm" id="themeBtn">深色</button>
  </nav>

  <main class="main">
    <div class="login-card">
      <div class="card-header">
        <h1 class="card-title">管理后台</h1>
        <p class="card-desc">超级管理员默认账号 admin；运营账号为 operator（需在服务端配置 OPERATOR_PASSWORD）</p>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label class="form-label">账号</label>
          <input type="text" class="form-input" id="username" placeholder="admin 或 operator" value="admin" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <p class="error-msg" id="errorMsg"></p>
        <button class="btn-primary-full" id="loginBtn" onclick="doLogin()">登录</button>
      </div>
      <div style="padding:0 20px 16px">
        <div class="notice">超级管理员可管理账号与系统设置；运营账号权限较低</div>
      </div>
    </div>

    <a href="/" class="back-link">← 返回首页</a>
  </main>

  <script>
    (function(){
      var canvas=document.getElementById('star-canvas');
      var ctx=canvas.getContext('2d');
      var W,H,stars=[],raf=null,running=false;

      function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}

      var _startTime=0;
      var MAX_STARS=280;
      var GROW_DURATION=5;

      function initStars(){
        resize();
        stars=[];
        for(var i=0;i<MAX_STARS;i++){
          stars.push({
            x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.15,brightness:Math.random(),
            twinkleSpeed:0.2+Math.random()*1.0,twinklePhase:Math.random()*Math.PI*2,color:starColor(),appearAt:Math.random()*GROW_DURATION
          });
        }
      }

      function starColor(){var c=['#FFFFFF','#E8F0FF','#FFE8D0','#D0E8FF','#FFF8E0','#C8D8FF'];return c[Math.floor(Math.random()*c.length)];}

      function hexToRgba(hex,a){
        if(hex==='#FFFFFF')return 'rgba(255,255,255,'+a+')';
        var r=parseInt(hex.slice(1,3),16);var g=parseInt(hex.slice(3,5),16);var b=parseInt(hex.slice(5,7),16);
        return 'rgba('+r+','+g+','+b+','+a+')';
      }

      function draw(ts){
        ctx.clearRect(0,0,W,H);
        var now=ts/1000;var elapsed=now-_startTime;
        stars.forEach(function(s){
          if(elapsed<s.appearAt)return;
          var fadeIn=Math.min(1,(elapsed-s.appearAt)/0.4);
          var twinkle=0.5+0.5*Math.sin(now*s.twinkleSpeed+s.twinklePhase);
          var alpha=(0.12+0.33*twinkle)*(0.5+s.brightness*0.5)*fadeIn;
          if(s.r>1.2){
            var glow=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*3.5);
            glow.addColorStop(0,hexToRgba(s.color,alpha*0.18));glow.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=glow;ctx.beginPath();ctx.arc(s.x,s.y,s.r*3.5,0,Math.PI*2);ctx.fill();
          }
          ctx.fillStyle=hexToRgba(s.color,alpha);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
        });
        if(running)raf=requestAnimationFrame(draw);
      }

      function startStars(){
        if(running)return;running=true;initStars();canvas.style.display='block';_startTime=performance.now()/1000;raf=requestAnimationFrame(draw);
      }

      function stopStars(){running=false;if(raf)cancelAnimationFrame(raf);ctx.clearRect(0,0,W,H);canvas.style.display='none';}

      window.addEventListener('resize',function(){if(running)initStars();});
      window._starsStart=startStars;window._starsStop=stopStars;
    })();

    (function(){
      var btn=document.getElementById('themeBtn');
      function apply(t){
        if(t==='dark'){
          document.documentElement.setAttribute('data-theme','dark');btn.textContent='浅色';
          window._starsStart&&window._starsStart();
        }else{
          document.documentElement.removeAttribute('data-theme');btn.textContent='深色';
          window._starsStop&&window._starsStop();
        }
      }
      var saved=localStorage.getItem('theme')||'light';apply(saved);
      btn.addEventListener('click',function(){var cur=document.documentElement.getAttribute('data-theme');var next=cur==='dark'?'light':'dark';apply(next);localStorage.setItem('theme',next);});
    })();

    document.getElementById('username').addEventListener('keypress',function(e){if(e.key==='Enter')doLogin();});
    document.getElementById('password').addEventListener('keypress',function(e){if(e.key==='Enter')doLogin();});

    async function doLogin(){
      var un=document.getElementById('username').value.trim()||'admin';
      var pwd=document.getElementById('password').value.trim();
      var err=document.getElementById('errorMsg');
      var btn=document.getElementById('loginBtn');
      if(!pwd){err.textContent='请输入密码';err.style.display='block';return;}
      err.style.display='none';btn.disabled=true;btn.textContent='验证中…';
      try{
        var res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:un,password:pwd})});
        var data=await res.json();
        if(data.success){
          btn.textContent='✓ 登录成功';
          var pack=data.data||data;
          var tok=pack.access_token||(pack.data&&pack.data.access_token);
          var refr=pack.refresh_token||(pack.data&&pack.data.refresh_token);
          try{
            if(tok)localStorage.setItem('admin_access_token',tok);
            if(refr)localStorage.setItem('admin_refresh_token',refr);
            document.cookie='ruitalk_session=active; path=/; SameSite=Lax';
          }catch(_e){}
          try{
            preloadOrdersForAdmin();
          }catch(_e){}
          setTimeout(function(){window.location.href='/home';},600);
        }
        else{err.textContent=data.message||'密码错误，请重试';err.style.display='block';btn.disabled=false;btn.textContent='登录';}
      }catch(e){err.textContent='网络错误，请重试';err.style.display='block';btn.disabled=false;btn.textContent='登录';}
    }

    function preloadOrdersForAdmin(){
      var pageSize=20;
      var params=new URLSearchParams({
        status:'全部',
        platform:'',
        start_date:'',
        end_date:'',
        limit:pageSize,
        offset:0
      });
      fetch('/api/admin/orders?'+params.toString())
        .then(function(res){return res.json().catch(function(){return null;});})
        .then(function(data){
          if(!data||!data.success)return;
          var payload={
            orders:data.orders||[],
            total:data.total||0,
            pageSize:pageSize,
            currentPage:0,
            filters:{status:'全部',platform:'全部',startDate:'',endDate:''},
            timestamp:Date.now()
          };
          try{
            sessionStorage.setItem('admin_orders_cache',JSON.stringify(payload));
          }catch(_e){}
        })
        .catch(function(){});
    }
  </script>
</body>
</html>
