[project]
name = "ruitalk-seller"
version = "1.0.0"
description = "Ruitalk Seller Terminal - AI-Powered Customer Service Backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ruitalk Team", email = "team@ruitalk.com" }
]
keywords = ["customer-service", "ai", "fastapi", "chatbot", "ecommerce"]

dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.27.0",
    "starlette>=1.0.0",
    "SQLAlchemy>=2.0.0",
    "PyMySQL>=1.1.0",
    "psycopg2-binary>=2.9.0",
    "neo4j>=5.16.0",
    "redis>=7.3.0",
    "fakeredis>=2.34.0",
    "asyncpg>=0.31.0",
    "anyio>=4.13.0",
    "httpx>=0.28.0",
    "PyJWT>=2.12.0",
    "requests>=2.31.0",
    "urllib3>=2.6.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "pydantic-core>=2.41.0",
    "annotated-types>=0.7.0",
    "typing-extensions>=4.15.0",
    "Flask>=3.0.0",
    "Werkzeug>=3.1.0",
    "Jinja2>=3.1.0",
    "websockets>=16.0",
    "httptools>=0.7.0",
    "watchfiles>=1.1.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "prometheus-client>=0.24.0",
    "sentry-sdk>=2.56.0",
    "colorama>=0.4.0",
    "certifi>=2026.2.0",
    "idna>=3.11",
    "packaging>=26.0",
    "pytz>=2026.1",
    "psutil>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.1.0",
    "coverage>=7.13.0",
    "ruff>=0.6.0",
    "mypy>=1.13.0",
    "black>=24.0.0",
]
prod = [
    "gunicorn>=22.0.0",
    "uvloop>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/ruitalk/ruitalk"
Documentation = "https://docs.ruitalk.com"
Repository = "https://github.com/ruitalk/ruitalk"
Issues = "https://github.com/ruitalk/ruitalk/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["backend/tests*", "backend/.venv*"]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
log-level = "info"
workers = 2

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
