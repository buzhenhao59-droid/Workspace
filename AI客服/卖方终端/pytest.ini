[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: 单元测试（无外部依赖）
    integration: 集成测试（需要外部组件）
    slow: 慢速测试
    redis: 需要 Redis 的测试
    neo4j: 需要 Neo4j 的测试
